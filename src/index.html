<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3fa7b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tidecrown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/*@CSS*/
</style>
</head>
<body>
<canvas id="c" aria-label="Tidecrown game world"></canvas>
<div id="hint" role="status"></div>
<div id="toast" class="sk" role="status"></div>
<button id="bag" aria-label="Open satchel">
  <svg viewBox="0 0 60 60"><path d="M14 22 C13 15,20 9,30 9 C40 9,47 15,46 22" fill="none" stroke="#2a2140" stroke-width="4" stroke-linecap="round"/>
  <path d="M8 24 C7 21,9 20,12 20 L49 21 C52 21,53 23,52 26 L49 49 C48 53,45 54,41 54 L19 53 C14 53,12 51,11 47 Z" fill="#c98f56" stroke="#2a2140" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M10 27 C20 33,40 33,51 27 L50 35 C40 39,20 39,11 34 Z" fill="#a8703f" stroke="#2a2140" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="30" cy="35" r="4" fill="#ffcf3a" stroke="#2a2140" stroke-width="2.5"/></svg>
</button>
<div id="cookbar"><button id="fwood" class="fuel sk" aria-label="Add driftwood"><img alt=""><b>0</b><span class="kd">Kindle</span></button><div class="cmid sk"><span id="cookinfo"></span><button id="cookx">Step away</button></div><button id="fkelp" class="fuel sk" aria-label="Add dry kelp"><img alt=""><b>0</b></button></div>
<button id="buffb" aria-label="Status effect"><span><img alt=""></span></button>
<div id="ctx" class="sk"></div>
<div id="dlg" class="sk"><div class="who"></div><div class="say"></div><div class="opts"></div></div>
<div id="scrim"></div>
<div id="bank" class="sk" aria-label="The Gull Post"><div class="bhead"><b>The Gull Post</b><div class="bmode"><button data-m="1">Take 1</button><button data-m="all" class="on">Take all</button></div><button class="x" id="bankx" aria-label="Close">&times;</button></div><div class="bgrid" id="bgrid"></div><div class="bsub"><span>Your pack</span><button id="bdep">Deposit all</button></div><div class="bgrid" id="bpack"></div><div class="bnote" id="bnote"></div></div>
<div id="panel" class="sk" aria-label="Satchel">
  <div class="tabs"><button class="tab" data-t="skills">Skills</button><button class="tab" data-t="pack">Pack</button><button class="tab" data-t="journal">Journal</button><button class="x" aria-label="Close">&times;</button></div>
  <div id="pbody"></div>
</div>
<div id="cc"><div class="card sk"><h1 id="cct">Who washed up?</h1><div id="ccbody"></div><button id="ccgo" class="sk"></button></div></div>
<script>
(()=>{
//@JS
})();
</script>
</body>
</html>
