<style>
:root{--ink:#2a2140;--paper:#fffaf0;--paper2:#f4e9cf;--sea:#3fa7b8;--coral:#ff6b6b;--sun:#ffcf3a;--muted:#6b5f86;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#f3ead8;--paper2:#e4d6b8;}}
:root[data-theme="dark"]{--paper:#f3ead8;--paper2:#e4d6b8;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.sk{background:var(--paper);border:3px solid var(--ink);border-radius:18px 7px 20px 9px/9px 20px 7px 18px;box-shadow:3px 4px 0 var(--ink)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);font-size:22px;line-height:1.2;text-align:center;width:min(86vw,420px);color:#fff;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);
  pointer-events:none;opacity:0;transition:opacity .6s}
#hint.on{opacity:1}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:calc((100vw - var(--mmw,0px)) / 2 + 6px);transform:translate(-50%,-14px);opacity:0;visibility:hidden;padding:5px 16px;font-size:18px;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s,visibility .3s;pointer-events:none;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - var(--mmw,0px) - 24px);box-sizing:border-box;z-index:9}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
#bag{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:56px;height:56px;padding:0;border:none;background:none;opacity:.88;z-index:4}
#bag svg{width:100%;height:100%;overflow:visible}
#snd{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:42px;height:42px;padding:0;border:none;background:none;opacity:.7;z-index:4}
#snd svg{width:100%;height:100%;overflow:visible}#snd .x{display:none}#snd.off .x{display:block}#snd.off{opacity:.45}
#bag.pulse{animation:pulse .9s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.2) rotate(-7deg)}}
#ctx{position:fixed;display:none;flex-direction:column;padding:4px 4px 6px;min-width:150px;z-index:6}
#ctx .t{font-size:15px;color:var(--muted);padding:4px 12px 0}
#ctx button,.opt{font-size:21px;background:none;border:none;text-align:left;padding:7px 12px;border-radius:10px 5px 11px 6px}
#ctx button:active,.opt:active,.opt:hover,#ctx button:hover{background:var(--paper2)}
#dlg{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:520px;margin:0 auto;padding:10px 14px 8px;display:none;z-index:6}
#dlg .who{font-size:17px;color:var(--muted)}
#dlg .opts{display:flex;flex-direction:column}
.opt::before{content:'\203A  ';color:var(--coral)}
#scrim{position:fixed;inset:0;background:rgba(42,33,64,.22);display:none;z-index:7}
#bank{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:460px;margin:0 auto;z-index:8;display:none;flex-direction:column;padding:8px 12px 12px;overflow:hidden}
#bank.on{display:flex}
.bhead{display:flex;align-items:center;gap:8px;flex:none}
.bhead b{font-weight:400;font-size:22px;flex:1}
.bmode{display:flex;border:2px solid var(--ink);border-radius:11px 5px 10px 6px;overflow:hidden}
.bmode button{font-size:16px;background:none;border:none;padding:2px 10px}

.bsub{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;color:var(--muted);font-size:16px;flex:none}
.bsub button{font-size:16px;background:var(--paper2);border:2px solid var(--ink);border-radius:11px 5px 10px 6px;padding:2px 10px;color:var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(6,var(--bs,48px));gap:6px;justify-content:center;flex:none}
.bgrid .slot{width:var(--bs,48px);height:var(--bs,48px);aspect-ratio:auto;position:relative}
.bgrid .slot img{width:82%;pointer-events:none}
.bgrid .cnt{position:absolute;bottom:1px;right:4px;font-style:normal;font-size:13px;line-height:1;text-shadow:0 0 2px #fffaf0,0 0 2px #fffaf0}
.bnote{text-align:center;color:var(--muted);font-size:15px;margin-top:6px;min-height:18px;flex:none}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;width:min(360px,calc(100vw - 20px));transform:translateX(118%);transition:transform .35s cubic-bezier(.3,1.2,.5,1);z-index:8;display:flex;flex-direction:column;overflow:hidden}
#panel.on{transform:none}
.tabs{display:flex;gap:2px;padding:6px 8px 0;align-items:center}
.tab{flex:1;font-size:19px;background:none;border:none;color:var(--muted);padding:6px 0 4px;border-bottom:3px solid transparent;border-radius:0}
.tab.on{color:var(--ink);border-bottom-color:var(--coral)}
.x{background:none;border:none;font-size:26px;width:40px;line-height:1}
.skill{display:flex;gap:12px;align-items:center;padding:6px 0 12px}
.skill img{width:52px;height:52px}
.skill.hid{opacity:.6}
.skill .q{width:52px;height:52px;display:grid;place-items:center;font-size:30px;border:2.5px dashed var(--ink);border-radius:50% 45% 52% 48%;flex:none;color:var(--muted)}
.sdesc.pd{flex:none;margin-bottom:10px}
.skill .m{flex:1}
.skill .top{display:flex;justify-content:space-between;font-size:21px}
.bar{height:15px;border:2.5px solid var(--ink);border-radius:9px 4px 10px 5px;overflow:hidden;background:var(--paper2);margin:3px 0}
.bar i{display:block;height:100%;background:var(--sea)}
.skill small{font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1;border:2.5px dashed rgba(42,33,64,.3);border-radius:13px 6px 12px 7px;display:grid;place-items:center;background:none;padding:0}
.slot.f{border-style:solid;border-color:var(--ink);background:var(--paper2)}
.slot.sel{background:var(--sun)}
.slot img{width:84%;pointer-events:none}
.ent{padding:8px 0;border-bottom:2px dashed rgba(42,33,64,.18)}
.ent b{font-size:20px}
.ent p{margin:2px 0 0;line-height:1.3;color:#4a3f63}
.muted{color:var(--muted)}
#cc{position:fixed;inset:0;z-index:20;display:none;background:linear-gradient(#bfe6ee,#3fa7b8);padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px);overflow:auto}
#cc.on{display:flex;align-items:center;justify-content:center}
#cc .card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:7px;padding:10px 11px 12px}
#cc h1{font-size:28px;font-weight:400;margin:0;text-align:center;line-height:1}
.cctop{display:flex;gap:10px;align-items:center}
#pv{position:static;inset:auto;width:112px;height:124px;flex:none;touch-action:auto}
.ccid{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccid .sub{color:var(--muted);font-size:16px;line-height:1.15}
.namerow{display:flex;gap:6px;align-items:center}
.namerow input{flex:1;font:inherit;font-size:21px;color:var(--ink);background:var(--paper2);border:2.5px solid var(--ink);border-radius:12px 5px 11px 6px;padding:3px 8px;min-width:0;height:40px}
.dice{font-size:22px;min-width:42px;height:40px;background:var(--sun);border:2.5px solid var(--ink);border-radius:12px 6px 13px 7px;padding:0 10px}
#ccrand{font-size:18px;height:36px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.pk{display:flex;align-items:center;border:2.5px solid var(--ink);border-radius:14px 6px 13px 7px;background:var(--paper2);height:44px;min-width:0}
.pk button{width:30px;height:100%;background:none;border:none;font-size:26px;line-height:1;flex:none;padding:0}
.pk button:active{background:var(--sun)}
.pk .val{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1.05}
.pk .val small{font-size:13px;color:var(--muted)}
.pk .val span{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:4px}
.pk .val.lock span{color:var(--muted)}
.sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none;display:inline-block}
.lockhint{min-height:19px;text-align:center;color:var(--muted);font-size:16px;line-height:1.15}
#ccgo{align-self:center;font-size:22px;padding:5px 24px;background:var(--coral);color:#fff}
#ccgo:disabled{opacity:.45}
.origins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 2px}
.org{text-align:left;padding:10px 12px 11px;font-size:15px;line-height:1.25;display:flex;flex-direction:column;gap:5px}
.otop{margin-top:2px}.otop #pv{width:96px;height:108px}
.org b{font-size:19px;font-weight:400;line-height:1.05}
.org .keep{color:var(--muted)}
.org.on{background:var(--sun)}
.odetail{flex:1;min-height:38px;text-align:left;font-size:16px;color:#4a3f63;line-height:1.2}.odetail b{font-weight:400;color:var(--ink)}
#cc .back{background:none;border:none;color:var(--muted);font-size:17px;text-decoration:underline;align-self:center;padding:4px 0 0}
@media (max-height:600px){#pv{width:92px;height:100px}#cc h1{font-size:24px}.ccid .sub{display:none}.pk{height:40px}.otop #pv{width:72px;height:82px}.origins{gap:7px}.org{padding:7px 9px 8px;gap:3px;font-size:14px}.org b{font-size:17px}.odetail{font-size:15px}}
#pbody{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:10px 14px 12px;font-size:19px}
#pbody .grid{grid-template-columns:repeat(4,var(--s,64px));justify-content:center;gap:8px;flex:none}
#pbody .grid+.grid{margin-top:14px}
#pbody .slot{width:var(--s,64px);height:var(--s,64px);aspect-ratio:auto;position:relative}
.slot .tag{position:absolute;top:3px;left:6px;font-size:12px;color:var(--muted);line-height:1}
.gearE{border-style:dotted!important;border-color:rgba(42,33,64,.5)!important;background:rgba(255,207,58,.1)}
#pbody .info{flex:1 1 auto;min-height:126px;margin-top:10px;overflow:hidden;padding-bottom:4px}
#pbody .info b{font-size:20px}
#pbody .slot .cnt{position:absolute;bottom:1px;right:5px;font-style:normal;font-size:15px;line-height:1;color:var(--ink);text-shadow:0 0 2px #fffaf0,0 0 2px #fffaf0}
#pbody .info p{margin:0 0 8px;font-size:17px;line-height:1.3;padding-bottom:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{font-size:17px;padding:3px 11px;background:var(--paper2);border:2px solid var(--ink);border-radius:12px 5px 11px 6px}
.acts button:active{background:var(--sun)}
.lockt{margin:0}
.lockrow{display:flex;justify-content:space-between;gap:8px;margin:8px 0 10px}
.lk{flex:1;aspect-ratio:1;max-width:56px;font-size:26px;background:none;border:2.5px dashed var(--ink);border-radius:50% 45% 52% 48%;color:var(--muted);padding:0}
.lk.sel{background:var(--sun);color:var(--ink);border-style:solid}
.clue{min-height:46px;text-align:center;font-size:18px;color:#4a3f63;line-height:1.2}
.jhead{margin:0 0 2px;flex:none}
.jlist{flex:1;min-height:0;overflow:hidden}
.pager{display:flex;align-items:center;justify-content:space-between;padding-top:8px;flex:none}
.pager button{width:46px;height:40px;font-size:26px;line-height:1;background:none;border:2.5px solid var(--ink);border-radius:50% 45% 52% 48%;padding:0}
.pager button:disabled{opacity:.25}
.pager span{color:var(--muted);font-size:17px}
#dlg .say{font-size:20px;line-height:1.25;margin:2px 0 4px}
#dlg .opt{padding:5px 10px;font-size:19px}

.you{display:flex;flex-direction:column;flex:1;min-height:0}
.youdoll{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.youdoll img{width:84px;height:102px;flex:none}
.youname{display:flex;flex-direction:column;gap:2px;font-size:17px}
.youname b{font-size:21px}
.youname small{color:var(--muted);font-size:15px}
#pbody .grid.g3{grid-template-columns:repeat(3,50px);gap:6px}
#pbody .grid{touch-action:none}#pbody img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}#pbody .slot{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}#pbody .gearE{background:none;border-style:dashed}#pbody .slot.dgsrc{opacity:.35}#pbody .slot.over{background:var(--sun);border-style:solid;border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,207,58,.6)}
.dgghost{position:fixed;z-index:30;width:96px;height:96px;margin:-78px 0 0 -48px;pointer-events:none;background:none;border:none;display:grid;place-items:center;filter:drop-shadow(0 4px 0 rgba(42,33,64,.25))}.dgghost img{width:96px;height:96px;opacity:.95}
#pbody .grid.g3 .slot{width:50px;height:50px}
.slot.none{border:none;background:none}
.you .info{margin-top:8px;flex:1;min-height:0;overflow:hidden}

.mapc{width:100%;flex:1;min-height:0;border:2.5px solid var(--ink);border-radius:14px 8px 12px 9px;touch-action:manipulation}
/* quests: Journal switch, quest cards, the tracker line */
.jsw{display:flex;gap:6px;margin:0 0 6px;flex:none}.jsw button{flex:1;font-size:17px;padding:3px 0}.jsw button.on{background:#ffcf3a}
.qlist{flex:1;min-height:0;overflow:hidden}
.quest{border:2px solid var(--ink);border-radius:12px;padding:6px 9px;margin-bottom:6px;background:#fffaf0}
.quest .qh{display:flex;justify-content:space-between;align-items:center;gap:6px}.quest .qh b{font-size:18px}.quest .qh button{font-size:14px;padding:1px 8px}.quest .qh button.on{background:#ffcf3a}
.qwhy{font-size:15px;margin:3px 0;color:#5e5670}
.quest ul{list-style:none;margin:2px 0 0;padding:0;font-size:16px}.quest li{margin:2px 0}.quest li.ok{color:#6f8f5a;text-decoration:line-through}.quest li.nx{font-weight:bold}.quest li i{display:block;font-style:normal;font-weight:normal;font-size:14px;color:#6a6080;margin-left:18px}
.qdone{font-size:15px}
#qtrack{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 58px);max-width:min(62vw,300px,calc(100vw - var(--mmw,0px) - 20px));text-align:left;font-size:14px;line-height:1.2;padding:5px 9px;display:none;flex-direction:column;opacity:.92;z-index:5}

#cookbar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}

.fuel{position:relative;width:76px;height:76px;padding:0;display:grid;place-items:center;border-radius:50% 46% 52% 48%!important;transition:transform .12s}

.cmid{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px 6px;font-size:16px;white-space:nowrap;margin-bottom:4px}
.cmid button{font-size:18px;background:var(--coral);color:#fff;border:2.5px solid var(--ink);border-radius:12px 6px 13px 7px;padding:1px 12px}
#buffb{position:fixed;right:calc(env(safe-area-inset-right,0px) + 80px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:44px;height:44px;border-radius:50%;padding:4px;border:none;display:none;z-index:4;background:conic-gradient(#ffcf3a calc(var(--p,100)*1%),rgba(42,33,64,.18) 0)}

.st.on{background:var(--sun)}
.st img{width:82%;pointer-events:none}
.st b{position:absolute;bottom:-6px;right:-5px;font-size:12px;font-weight:400;background:#fffaf0;border:1.5px solid var(--ink);border-radius:8px;padding:0 4px;line-height:1.2}

.skb{width:100%;text-align:left;background:none;border:none;padding:6px 0 10px;border-bottom:2px dashed rgba(42,33,64,.15);border-radius:0}
.skb:active{background:var(--paper2)}
.skb .chev{font-size:28px;color:var(--muted);padding-left:4px}
.back2{background:none;border:none;font-size:18px;color:var(--muted);padding:0 0 2px;text-align:left;flex:none}
#pbody .skill{padding:4px 0 6px;flex:none}
.sdesc{margin:0 0 6px;font-size:17px;line-height:1.22;color:#4a3f63;flex:0 1 4.9em;min-height:2.5em;overflow:hidden}
.sh{font-size:15px;color:var(--muted);margin:2px 0 4px}
.ways{display:flex;gap:8px;flex:none;margin-bottom:6px}.way{display:flex;flex-direction:column;align-items:center;gap:1px;width:64px;padding:4px 2px 3px;background:#fffaf0;border:2px solid var(--ink);border-radius:12px 5px 11px 6px}.way img{width:34px;height:34px}.way small{font-size:12px;color:var(--ink);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}.way.hid{background:none;border-style:dashed;color:var(--muted)}.way.hid .q{font-size:24px;line-height:34px;height:34px}.way.hid small{color:var(--muted)}.way.hid.sel{background:var(--sun);border-style:solid}

<script>
(()=>{
const MODE='test';
const INK='#2a2140';
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
let W=0,H=0,DPR=1,Z=1,ZB=1,camZ=1;
/* render resolution (build 37): at most 1.5 pixels per CSS pixel, and it steps down by .25 (to 1) when frames run
   slow for a while and back up when they run fast; the hand-drawn look hides it, and filling pixels is most of the
   cost. The night layer (dk) is drawn at half that: its edges are all soft gradients. */
const DPRCAP=Math.min(1.5,window.devicePixelRatio||1);let DPRQ=DPRCAP;const DKS=.5;
function resize(){DPR=DPRQ;W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);dk.width=Math.round(cv.width*DKS);dk.height=Math.round(cv.height*DKS);ZB=Math.max(.85,Math.min(1.4,Math.min(W,H)/430));Z=ZB*camZ;}
addEventListener('resize',resize);resize();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;


/* frame-time watch: an average of the last frames; slow for 2 s drops the resolution a step, fast for 6 s raises it */
const PERF={ema:16,slow:0,fast:0,hist:new Float32Array(240),hi:0};
function perfTick(dt){const ms=dt*1000;PERF.hist[PERF.hi++%240]=ms;if(intro!=null||ccOn)return;PERF.ema+=(ms-PERF.ema)*.05;
 if(PERF.ema>26){PERF.slow+=dt;PERF.fast=0;}else if(PERF.ema<13){PERF.fast+=dt;PERF.slow=0;}else{PERF.slow=0;PERF.fast=0;}
 if(PERF.slow>2&&DPRQ>1){DPRQ=Math.max(1,DPRQ-.25);PERF.slow=0;PERF.ema=18;resize();}
 else if(PERF.fast>6&&DPRQ<DPRCAP){DPRQ=Math.min(DPRCAP,DPRQ+.25);PERF.fast=0;PERF.ema=16;resize();}}
/* ---------- hand-drawn primitives ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let now=0,boil=0;
function sketch(pts,closed,seed,amp,fill,stroke,lw){
  const r=mulberry(seed*9973+boil*7919+1);
  const q=pts.map(p=>[p[0]+(r()-.5)*amp,p[1]+(r()-.5)*amp]);
  const n=q.length;ctx.beginPath();
  if(closed){let a=q[n-1],b=q[0];ctx.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);
    for(let i=0;i<n;i++){a=q[i];b=q[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}ctx.closePath();}
  else{ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<n-1;i++){const a=q[i],b=q[i+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}ctx.lineTo(q[n-1][0],q[n-1][1]);}
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
}
function ell(x,y,rx,ry,n){const a=[];n=n||14;for(let i=0;i<n;i++){const t=i/n*6.2832;a.push([x+Math.cos(t)*rx,y+Math.sin(t)*ry]);}return a;}
function blob(x,y,rx,ry,seed,fill,lw,amp){sketch(ell(x,y,rx,ry,Math.max(8,Math.round((rx+ry)/3))),true,seed,amp==null?Math.min(3,(rx+ry)*.08):amp,fill,lw===0?null:INK,lw==null?3:lw);}
function ln(pts,seed,lw,col,amp){const o=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];o.push(a,[a[0]+(b[0]-a[0])/3,a[1]+(b[1]-a[1])/3],[a[0]+(b[0]-a[0])*2/3,a[1]+(b[1]-a[1])*2/3]);}o.push(pts[pts.length-1]);sketch(o,false,seed,amp==null?1.6:amp,null,col||INK,lw||3);}
function rrPts(x,y,w,h,r){const p=[];const c=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];for(const [cx,cy,a0] of c){for(let i=0;i<=2;i++){const a=a0+i/2*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}}return p;}
function dot(x,y,r,col){ctx.fillStyle=col||INK;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill();}
function otext(t,x,y,size,fill,stroke){ctx.font=size+"px 'Patrick Hand','Comic Sans MS',cursive";ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=stroke||INK;ctx.strokeText(t,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(t,x,y);}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return d;}
function star(x,y,r,col){ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*6.2832-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function wrap(t,maxW){const words=t.split(' ');const lines=[];let cur='';for(const w of words){const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tst;}if(cur)lines.push(cur);return lines;}

/* ---------- world ---------- */
/* KSC: the Key's size (build 28 made it 67% larger) */
const KSC=1.67;
function iR(a){return KSC*(520+60*Math.sin(3*a+1)+35*Math.sin(5*a+2.3)+20*Math.sin(9*a+.7));}
function gR(a){return iR(a)*.8+14*Math.sin(7*a+1.3)-10;}
function polar(a,r){return [Math.cos(a)*r,Math.sin(a)*r];}
const NP=150,sandPts=[],grassPts=[],shallowPts=[],foamPts=[];
for(let i=0;i<NP;i++){const a=i/NP*6.2832,c=Math.cos(a),s=Math.sin(a);sandPts.push([c*iR(a),s*iR(a)]);grassPts.push([c*gR(a),s*gR(a)]);shallowPts.push([c*(iR(a)+60),s*(iR(a)+60)]);foamPts.push([c*(iR(a)+9),s*(iR(a)+9)]);}
const R0=iR(0);
/* tide: 1 is high water, 0 is low. Low water exposes a wet band of TIDE_REACH outside the dry sand. */
/* a day is 24 minutes; like real tides there are two highs a day, so the tide cycles every 12 and the water is always on the move. */
const DAY_PERIOD=24*60000,TIDE_PERIOD=DAY_PERIOD/2,TIDE_REACH=46;let tideF=null;
var DAYOFF=0;/* test build only: shifts the time of day */
function tideLevel(){if(tideF!=null)return tideF;return .5+.5*Math.cos(Date.now()/TIDE_PERIOD*6.2832);}
function wetR(a){return iR(a)+(1-tideLevel())*TIDE_REACH;}
const DOCK={x0:R0-40,x1:R0+192,y0:-24,y1:24};
function onIsland(x,y){return Math.hypot(x,y)<=wetR(Math.atan2(y,x))-10;}
function onDock(x,y){return x>=DOCK.x0&&x<=DOCK.x1-10&&y>=DOCK.y0+6&&y<=DOCK.y1-6;}
const SH={on:false};
function walkable(x,y){if(SH.on)return shWalkable(x,y);return onIsland(x,y)||onDock(x,y)||!!onIsletK(x,y);}
function clampLand(x,y){if(SH.on)return shClamp(x,y);if(walkable(x,y))return[x,y];const a=Math.atan2(y,x);return polar(a,wetR(a)-18);}

/* fishing spots roam: a spot fades in, lives a couple of minutes, fades out, and a new one bubbles up somewhere else. The glowing pool is a place and stays put. */
const spots=[];
function spotHere(a,type){const p=polar(a,iR(a)+60),ap=polar(a,iR(a)-24);return {x:p[0],y:p[1],ax:ap[0],ay:ap[1],type,seed:Math.floor(Math.random()*900)+5,a,al:0,st:'in',life:120+Math.random()*180};}
function spotAngle(type){for(let i=0;i<40;i++){let a;if(type==='deep')a=-2.7+Math.random()*1.2;else{a=Math.random()*6.2832;if(a>Math.PI)a-=6.2832;if(Math.abs(a)<.5||(a<-1.4&&a>-2.8)||Math.abs(Math.abs(a)-Math.PI)<.4)continue;}
 if(spots.some(s=>Math.abs(angDiff(s.a,a))<.42))continue;return a;}return null;}
function addSpot(a,type){spots.push(spotHere(a,type));}
addSpot(.85,'shallow');addSpot(2.35,'shallow');addSpot(-1.85,'deep');addSpot(-2.35,'deep');
spots.push({x:polar(Math.PI,iR(Math.PI)+60)[0],y:polar(Math.PI,iR(Math.PI)+60)[1],ax:polar(Math.PI,iR(Math.PI)-24)[0],ay:polar(Math.PI,iR(Math.PI)-24)[1],type:'moon',seed:57,a:Math.PI,al:1,st:'on',life:1e9});
spots.push(spotHere(.42,'shallow'));
const MOON=spots.find(s=>s.type==='moon');
function spotsUpdate(dt){for(const sp of spots){if(sp.type==='moon')continue;
 if(sp.st==='in'){sp.al=Math.min(1,sp.al+dt/2.5);if(sp.al>=1)sp.st='on';}
 else if(sp.st==='on'){sp.life-=dt;if(sp.life<=0)sp.st='out';}
 else{sp.al=Math.max(0,sp.al-dt/2.5);}}
 for(let i=spots.length-1;i>=0;i--){const sp=spots[i];if(sp.st==='out'&&sp.al<=0){spots.splice(i,1);const a=spotAngle(sp.type);if(a!=null)spots.push(spotHere(a,sp.type));}}}
const REQ={shallow:1,deep:10,moon:20};

const G={x:R0+170,y:-2,talk:false};
const SIGN={x:R0-95,y:-58};
/* Brimble's camp: a flat shelf on the lee (west) shoulder of the hill near the middle of the Key, just below its
   crown: out of the east wind and spray, a few steps from a lookout over the whole horizon (HILL in 30-terrain) */
const OLDFIRE=(()=>{const p=polar(-.95,iR(-.95)-42);return{x:Math.round(p[0]),y:Math.round(p[1])};})();
const HILL={x:50*KSC,y:-70*KSC};
const FIRE={x:-135*KSC,y:-62*KSC};
const HEAD=(()=>{const a=Math.PI-.45,p=polar(a,iR(a)-70);return{x:p[0],y:p[1]};})();
const POOL=(()=>{const p=polar(2.05,250*KSC);return{x:p[0],y:p[1]};})();
const GULL={x:R0-150,y:-34};
const crabHome=polar(1.6,iR(1.6)-60);
const CRAB={x:crabHome[0],y:crabHome[1],tx:crabHome[0],ty:crabHome[1],wait:1,hop:0};
const rocks=[];
[-1.85,-2.35].forEach((a,j)=>{[-.09,-.03,.05,.1].forEach((d,i)=>{const p=polar(a+d,iR(a+d)+(i%2?2:-8));rocks.push({x:p[0],y:p[1],rx:14+((i*7+j*3)%9),ry:10+((i*5)%6),seed:200+j*10+i});});});
/* the windward east shore is rockier */
[-.62,-.45,-.3,.32,.48,.66].forEach((a,i)=>{const p=polar(a,iR(a)-4);rocks.push({x:p[0],y:p[1],rx:13+(i*5)%8,ry:9+(i*3)%5,seed:240+i});});
/* a low outcrop on the windward (east) edge of Brimble's shelf */
/* set back behind the tripod, so the camp reads in front of them */
[[74,-40,16,11],[104,-28,13,9],[90,-54,11,8]].forEach(([dx,dy,rx,ry],i)=>rocks.push({x:FIRE.x+dx,y:FIRE.y+dy,rx,ry,seed:260+i,camp:1}));

const trees=[];
{const r=mulberry(7);let tries=0;const avoid=[[GULL.x,GULL.y],[POOL.x,POOL.y],[R0-80,24],[OLDFIRE.x,OLDFIRE.y],[SIGN.x,SIGN.y],[HEAD.x,HEAD.y],[R0-25,0],crabHome,...spots.map(s=>[s.ax,s.ay])];
 while(trees.length<18&&tries<800){tries++;const a=r()*6.2832,d=Math.sqrt(r())*.74;const x=Math.cos(a)*gR(a)*d,y=Math.sin(a)*gR(a)*d;
  if(avoid.some(p=>Math.hypot(p[0]-x,p[1]-y)<120))continue;if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<90))continue;
  trees.push({x,y,s:.85+r()*.45,seed:trees.length*31+3,lean:(r()-.5)*18,hue:r()});}
}
const tufts=[];{const r=mulberry(11);for(let i=0;i<150;i++){const a=r()*6.2832,d=Math.sqrt(r())*.93;tufts.push({x:Math.cos(a)*gR(a)*d,y:Math.sin(a)*gR(a)*d,f:r()<.18,seed:i+500,c:r()});}}
const waves=[];{const r=mulberry(23);for(let i=0;i<300;i++){const a=r()*6.2832,d=iR(a)+110+r()*(i<140?1100:4300);waves.push({x:Math.cos(a)*d,y:Math.sin(a)*d,s:r()*6,seed:i+900});}}

/* ---------- game data ---------- */
const FISH={
 minnow:{name:'Minnowbit',lvl:1,xp:12,win:900,w:10,col:'#a9dbe9',val:2,spot:'shallow',desc:'Small, silver, and mildly offended to be here.'},
 perch:{name:'Pebble Perch',lvl:5,xp:22,win:760,w:6,col:'#d4ab6f',val:4,spot:'shallow',desc:'Speckled like a beach. Tastes a bit like one, too.'},
 grump:{name:'Grumpfish',lvl:10,xp:40,win:660,w:8,col:'#8f84c0',val:7,spot:'deep',desc:'Has never once been happy about anything. Respect.'},
 eel:{name:'Jellybean Eel',lvl:15,xp:60,win:560,w:5,col:'#ff8fb1',val:10,spot:'deep',desc:'Wiggly, striped, and faintly sugary.'},
 koi:{name:'Moonkoi',lvl:20,xp:120,win:520,w:1,col:'#eef3ff',val:25,spot:'moon',desc:'Glows softly. Looks at you like it knows something you don\u2019t.'}
};
const BOTTLES=[
 'If you\u2019re reading this, the Lantern Sea took you too. Don\u2019t be scared. It only takes people it has plans for. \u2014 C.',
 'Day forty. The stone head on the Key sings at night. I think it\u2019s singing directions.',
 'The Far Light is real. I saw it once from the crow\u2019s nest, and it blinked back. Keep going. \u2014 C.'
];
const JOURNAL={
 washed:['Washed ashore','Woke up on warm sand with salt in my ears and no idea how I got here. There\u2019s a dock. There\u2019s a bucket on the dock. The bucket is looking at me.'],

 thehollow:['The Hollow','Something the size of a ship lies across the heart of the forest, breathing. Everything keeps its distance. Everything else here is a symptom of it.'],
 hollowmaw:['Hollowmaw','A dead tree until it unfolds. Its heartwood is rotting, so it eats living trees to feel warm. It wants warmth, not me.'],
 mossback:['Mossback','Soft, round, mossy, and starving. It used to eat what the Hollowmaws left. Fed, it follows.'],
 moonlapper:['Moonlapper','Pale, long-necked, eyeless. It laps the moon off the water at night, and the moon thins. It is drinking light because the forest has none.'],
 swimming:['Swimming','I waded in and kept going. There is a rhythm to it: keep stroking and the sea keeps you up; stop and it takes you under and carries you back to the last shore. People say they have swum between islands. Even past the Shadow Forest.'],
 jelly:['Lantern jelly','A glowing bell with trailing threads, drifting where it pleases. Brush one and everything tingles for a while.'],
 swamfar:['The long swim','I swam east off the Key until the dark islands took me in. So the rumour is true.'],
 foraging:['Foraging','The tide gives and the tide takes back. Grab what the waves drop before the backwash, and scrape the salt they leave on rock and piling.'],
 tide:['The tide','Twice a day the sea breathes in and out. High water brings wash-ups. Low water bares a band of wet sand, and the rocks sit in their pools.'],
 hearth:['Cooking','Brimble taught me to cook. A fire is a promise: keep it fed and it keeps you.'],
 driftwood:['Driftwood','Bleached and bone dry. The waves leave it on the sand, and take it back if you dawdle. Burns steady.'],
 kelp:['Dry kelp','Brittle seaweed from the rocky shores. Burns hot and wild, and the smoke smells like the deep.'],
 perfectcook:['Golden both sides','Flip at golden, pull at golden. Eat one and my hands get sharper for a while.'],
 smoky:['Smoky fish','Cooked over a kelp flare, fish come out smoky. The smell gets on my hands and the fish come running.'],
 firstfire:['A fire of my own','I lit a fire with my own hands. Brimble says a fire is a promise. Starve it and all it leaves you is ash.'],
 ash:['Ash','What a starved fire leaves behind. Soft, grey, faintly warm. Brimble gets suspiciously excited about it.'],
 stache:['The Ash Mustache','Brimble braided ten scoops of ash into a mustache, exactly like the one the Gull’s head cook wore. It is ridiculous. It is magnificent. Gubbins pays extra to anyone wearing it.'],
 thimblekit:['The sailmaker’s kit','Sir Thimble’s helmet was the Grinning Gull’s sailmaker’s thimble. He wants the rest of the kit: a palm, a fid and waxed twine, all somewhere the sea put them.'],
 sewing:['How a seam holds','Sir Thimble showed me: the palm pushes, the fid opens, the twine is waxed so it bites. I could sew canvas, given a needle. I do not have one. Yet.'],
 teapot:['Brimble’s teapot','He cooks in it, hung on a driftwood tripod beside his fire. It has never once made tea, and he is proud of that.'],
 palm:['Palms','They grow on the sand, leaning the way the trade wind pushes them. Up the hill it is too cool and foggy for them; the wobble trees have that.'],
 monsoon:['Monsoon','Most days bring one short warm shower. Now and then a monsoon: a day of wind and rain that floods the low ground, throws the sea up the beach and pulls old trees down.'],
 windfall:['Windfall','The storm brought an old wobble tree down. Branches come off by hand; the trunk wants a hatchet. Left alone it rots, and a sapling takes the spot.'],
 stormfish:['Fish on the grass','After a monsoon there are fish flapping on land, thrown up by the waves. They do not keep. Neither does the gull who spots them first.'],
 stormwash:['What storms bring','A monsoon throws up what the small waves never could: drift logs, crates, old nets, ship timber. One piece had green paint and letters on it. The Gull was green, Brimble says.'],
 cairn:['The cairn','Someone stacked stones on the very top of the Key. From there every shore shows, and the sea all round. Brimble says he watches for ships from just below it.'],
 stumpcache:['Something the forest swallowed','A rotted pouch tangled in the roots of a stump, still holding shells. Somebody lost it here long before me.'],
 clam:['A giant clam shell','Old, empty, wedged into the reef nearest the Key. A driftwood stick levers it out. The hinge is the thickest shell I have ever held.'],
 shellblade:['A shell blade','Ground out of a clam hinge on the north rocks, wet sand doing the cutting. Islanders with no stone did exactly this.'],
 hatchet:['A hatchet','A shell blade, driftwood and kelp twine. Ugly, but it bites. The wobble trees went very quiet when I made it.'],
 wobblelog:['Wobblewood','The wobble trees give up a log if you chop in time with their sway. Burns long and bright.'],
 bonfire:['Bonfire','Wobblewood and driftwood stacked high. Burns twice as long and lights half the island.'],
 charcoal:['Charcoal','A black lump left in the ash of a driftwood fire. Hotter than anything I’ve burned.'],
 seasalt:['Sea salt','White crystals a wave leaves on rock or piling, or what is left where kelp burned down. Brimble would have opinions.'],
 gullbank:['Mortimer Gull','A seagull in a banker’s visor runs the Gull Post. Gulls steal everything, so naturally they’re the only ones trusted to keep it safe.'],
 sunstone:['Sunstone','A stone left behind by a long, white-hot fire. Warm all the way through. It remembers being part of the sun.'],
 pearl:['Ember pearl','A warm bead that formed in the heart of a wobblewood fire. It hums when I hold it.'],
 kindleseen:['The runaway log','A piece of driftwood on the beach blinked at me, then ran off on tiny legs. Logs are not supposed to do that.'],
 kindle:['Kindle','A wild little log who moved into my woodpile after three nights of firelight and ash. When a fire is about to die he leaps in. He runs on ash, the weirdo.'],
 gull:['The Grinning Gull','Brimble’s old ship. Her captain wrote letters and tossed them overboard, signed only with a C.'],
 strife:['Strife','The longaxe, the hard way. Tap to slice with the blade, slide across a thing to knock it with the haft. Provoke it, read the tell, knock it on the tell to break it.'],
 accord:['Accord','The longaxe, the gentle way: slide straight at a thing to prod it with the haft. Prod it on the tell and it calms; prod a calm thing again and what I win stays won.'],
 bollard:['Old Bollard','An iron mooring post at the root of the pier, with a face. The Grinning Gull tied up to him once. A hundred years of ropes and he misses every one. Happy to be walloped, happier to be tied.'],
 deadwood:['Dead wood','A grey limb that came off a Hollowmaw when a trip put it down. It burns, sulkily. Brimble says it tastes of sulking too.'],
 planted:['Planted','A Hollowmaw, held calm and bound, took an ember pearl into its hollow and put roots down. It is a tree again, with a little warm light in it. A little light got in.'],
 pool:['The still pool','A pond so calm it shows who you could be. Looking in lets me change how I look, and new looks surface as I discover things.'],
 horizon:['A tower to the northeast','Through the spyglass I saw a crooked tower far to the northeast, with a light blinking on top. A heading, if I ever get a boat.'],
 moonpool:['Moonlit pool','When it\u2019s dark, the water off the west shore glows. Something pale circles underneath.'],

   every lit fire casting outward. Shadows from one light never stack: a patch of ground is either out of the sun or
   not, so all sun shadows (trunk and canopy, tree and crab) go into one silhouette layer drawn at one darkness.

   layer. Cloud shade is its own layer too, and where a cloud covers the sun the sun shadows are cut away, leaving
   only the faint contact shadow every object keeps where it meets the ground. Dense canopy also blocks skylight

const ccEl=$('cc'),ccBody=$('ccbody'),ccGo=$('ccgo'),ccT=$('cct'),ccS=$('ccs');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const PICKS=[
 ['kin','Kin',()=>Object.keys(KIN),v=>KIN[v].name],
 ['tone','Tone',()=>[0,1,2,3],v=>(KIN[draft.kin]||KIN.human).toneN[v],v=>(KIN[draft.kin]||KIN.human).tones[v]],
 ['shape','Shape',()=>Object.keys(SHAPES),v=>SHAPES[v][2]],
 ['eyes','Eyes',()=>Object.keys(EYES),v=>EYES[v]],
 ['hair','Hair',()=>Object.keys(HAIRS),v=>HAIRS[v]],
 ['hc','Hair color',()=>HAIRC.map((c,i)=>i),v=>HAIRCN[v],v=>HAIRC[v]],
 ['mark','Mark',()=>Object.keys(MARKS),v=>MARKS[v]],
 ['col','Outfit',()=>COLS.map((c,i)=>i),v=>COLN[v],v=>COLS[v]]];
function isLocked(k,v){const L=LOCKS[k]&&LOCKS[k][v];return L&&!S.journal[L[0]]?L[1]:null;}
function rName(){return pick(NAME1)+' '+pick(NAME2);}
function randomLook(){const o={name:rName()};PICKS.forEach(([k,,opts])=>{o[k]=pick(opts().filter(x=>!isLocked(k,x)));});return o;}
function rowsHTML(){return PICKS.map(([k,l,,name,sw])=>{const cur=view[k]!=null?view[k]:draft[k],lk=isLocked(k,cur);
 const inner=lk?'???':(sw?`<i class="sw" style="background:${sw(cur)}"></i>`:'')+name(cur);
 return `<div class="pk"><button data-k="${k}" data-d="-1" aria-label="Previous ${l}">‹</button><span class="val${lk?' lock':''}"><small>${l}</small><span>${inner}</span></span><button data-k="${k}" data-d="1" aria-label="Next ${l}">›</button></div>`;}).join('');}
function renderCC(){ccEl.classList.add('on');const m=ccMode==='mirror';
 if(ccStep===1){ccT.textContent=m?'The still pool':'Who washed up?';
  ccBody.innerHTML=`<div class="cctop"><canvas id="pv" aria-label="Your character"></canvas><div class="ccid"><div class="sub">${m?'New looks surface here as you discover things.':'Some of this can change later, if you find the right place.'}</div>`+
   (m?'':`<div class="namerow"><input id="ccname" maxlength="18" autocomplete="off" value="${esc(draft.name)}" aria-label="Name"><button class="dice" id="ccdice" aria-label="Random name">⚄</button></div>`)+
   `<button class="dice" id="ccrand">Surprise me</button></div></div><div id="ccrows" class="pgrid">${rowsHTML()}</div><div class="lockhint" id="cclock">${KIN[draft.kin].blurb}</div>`;
  ccGo.textContent=m?'Step back':'Next: how you got here';ccGo.disabled=false;}
 else{ccT.textContent='How did you get here?';const sel=ccOrigin?EQUIP[ORIGINS[ccOrigin].keep]:null;
  ccBody.innerHTML=`<div class="cctop otop"><canvas id="pv" aria-label="Your character"></canvas><div class="odetail">${sel?'<b>'+sel.name+'.</b> '+sel.desc:'<b>'+esc(draft.name)+'</b> washed up with nothing at all. Pick a past. Each comes with a keepsake.'}</div></div><div class="origins">`+Object.keys(ORIGINS).map(k=>{const O=ORIGINS[k];return `<button class="org sk${ccOrigin===k?' on':''}" data-o="${k}"><b>${O.name}</b><span>${O.line}</span><span class="keep">Keepsake: ${EQUIP[O.keep].name}</span></button>`;}).join('')+
   `</div><button class="back" id="ccback">Back to looks</button>`;
  ccGo.textContent='Wash ashore';ccGo.disabled=!ccOrigin;}}
ccBody.addEventListener('click',e=>{const b=e.target.closest('[data-k]');
 if(b){const k=b.dataset.k,d=+b.dataset.d,vals=PICKS.find(p=>p[0]===k)[2]();const cur=view[k]!=null?view[k]:draft[k];let i=vals.indexOf(cur);i=(i+d+vals.length)%vals.length;
  const nv=vals[i];view[k]=nv;const lk=isLocked(k,nv);if(!lk)draft[k]=nv;SCF.k=1;SCF.dir=d;$('ccrows').innerHTML=rowsHTML();$('cclock').textContent=lk||(k==='kin'?KIN[nv].blurb:'');return;}
 if(e.target.id==='ccdice'){draft.name=rName();$('ccname').value=draft.name;return;}
 if(e.target.id==='ccrand'){const n=draft.name;draft=randomLook();draft.name=n;view={};$('ccrows').innerHTML=rowsHTML();$('cclock').textContent=KIN[draft.kin].blurb;return;}
 if(e.target.id==='ccback'){ccStep=1;renderCC();return;}
 const o=e.target.closest('[data-o]');if(o){ccOrigin=o.dataset.o;SCF.k=1.3;SCF.dir=1;renderCC();}});
ccBody.addEventListener('input',e=>{if(e.target.id==='ccname')draft.name=e.target.value;});
ccGo.onclick=()=>{
 if(ccMode==='mirror'){S.char=draft;save();closeCC();return;}
 if(ccStep===1){if(!draft.name.trim())draft.name=rName();ccStep=2;renderCC();return;}
 if(!ccOrigin)return;draft.name=draft.name.trim().slice(0,18);S.char=draft;S.origin=ccOrigin;
 const k=ORIGINS[ccOrigin].keep;if(!S.eq.trinket)S.eq.trinket=k;else S.inv.push({id:k});S.owned[k]=1;save();closeCC();begin();};
function openCreator(mode){ccMode=mode;ccStep=1;view={};draft=Object.assign({},S.char||randomLook());if(draft.hc==null)draft.hc=0;ccOrigin=S.origin||null;ccOn=true;closeCtx();closeDlg();closePanel();renderCC();}
function closeCC(){ccOn=false;ccEl.classList.remove('on');}
function renderPreview(){const c=$('pv');if(!c)return;const d=Math.min(2,devicePixelRatio||1),w=c.clientWidth||112,h=c.clientHeight||124;
 if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}
 const keep=ctx;ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
 const g=ctx.createRadialGradient(w/2,h*.55,6,w/2,h*.55,w*.55);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 const sc=(h-16)/60;blob(w/2,h-12,w*.4,8,300,'#f3d27a',2.5);ctx.save();ctx.translate(w/2,h-13);ctx.scale(sc,sc);
 SCF.k=Math.max(0,SCF.k-fdt*1.6);drawChar(draft,ccMode==='mirror'?S.eq:(ccOrigin?{trinket:ORIGINS[ccOrigin].keep}:{}),0,0,1,false,false);ctx.restore();ctx=keep;}
/* the scarf is alive while you decide: it stretches and twists on its own, and flicks when you change something */
const SCF={k:0,dir:1};
function scarfIdle(){if(!ccOn)return [1,0];const st=1+.22*Math.sin(now*.9)+.14*Math.sin(now*2.3+1)+SCF.k*.6,tw=Math.sin(now*1.3)*5+Math.cos(now*.5)*3-SCF.k*8*SCF.dir;return [st,tw];}
function begin(){sfx('whoosh');intro=RM?null:0;setTimeout(showHint,RM?300:2600);if(!S.journal.washed)setTimeout(()=>discover('washed'),3400);}

/* tide and foraging. The tide is a real-time cycle shared by everyone: high water brings wash-ups, low water exposes the wet band (and later the flats). */
const wetPts=[];for(let i=0;i<NP;i++)wetPts.push([0,0]);
function tideGeom(){const t=tideLevel();for(let i=0;i<NP;i++){const a=i/NP*6.2832,r=iR(a)+(1-t)*TIDE_REACH;wetPts[i][0]=Math.cos(a)*r;wetPts[i][1]=Math.sin(a)*r;}}
function drawWet(){const t=tideLevel();if(t>.985)return;sketch(wetPts,true,1,4,'#e3c27a',INK,3.5);
 ctx.globalAlpha=.35;for(let i=0;i<NP;i+=5){const a=i/NP*6.2832,r=iR(a)+(1-t)*TIDE_REACH*.5+Math.sin(a*9+i)*4;ln([[Math.cos(a)*r-5,Math.sin(a)*r],[Math.cos(a)*r+5,Math.sin(a)*r+1]],2000+i,1.5,'#fff',.4);}ctx.globalAlpha=1;}
function drawFoam(){const t=tideLevel();ctx.setLineDash([16,12]);ctx.lineDashOffset=-now*8;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;ctx.beginPath();
 for(let i=0;i<NP;i++){const a=i/NP*6.2832,r=iR(a)+(1-t)*TIDE_REACH+9+Math.sin(now*1.4+a*7)*3;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();ctx.setLineDash([]);}

/* breaking waves: a swell builds offshore, foam runs up the beach, and whatever it carried is lying there when it pulls back. The next wave over an item may take it again. Everything on the sand comes from this; in a monsoon, heavier things too (29b-storm), never the heaviest. S.shore holds what the beach has right now. */
const BREAKS=[];let breakT=3;const SHORE_MAX=14;
const WASH=[['wood',44,4],['kelp',30,3],['shells',16,5],['bait',6,6],['wobble',4,10]];
function rollWash(){const r=Math.random()*100;let acc=0;for(const [k,wt] of WASH){acc+=wt;if(r<acc)return k;}return 'wood';}
function spawnBreak(){const pa=Math.atan2(P.y,P.x),t=tideLevel();let a0=pa+(Math.random()-.5)*1.8;
 /* the sea comes for its salt: a wave near you aims at a sparkling surface more often than not */
 const salted=SURF.filter(s=>s.st==='sparkle'&&Math.abs(angDiff(Math.atan2(s.y,s.x),pa))<1.1);if(salted.length&&Math.random()<.6){const s=pick(salted);a0=Math.atan2(s.y,s.x)+(Math.random()-.5)*.12;}
 /* size: most waves are small and just break on the shore, rocks and pier. Big ones are rare, run far up the beach and can carry up to three things. */
 let r=Math.random();/* wind: the windward shore gets the big ones, the lee gets the small */r*=.55+.5*waveAlign(a0)*(.6+.6*WX.ws);
 /* a storm's swell runs ahead of it, and in a monsoon most waves are big */const sw=Math.max(monNow(),WX.pre*.5);r=1-(1-r)*(1-.6*sw);r=Math.min(.999,r);
 const size=r<.55?r*.5:r<.86?.4+(r-.55)*1.2:.8+(r-.86)*1.4;let n=0;
 if(size<.4){if(Math.random()<.22+.18*t)n=1;}
 else if(size<.8){const p=Math.random();n=p<.35+.3*t?1:0;if(p<.08+.1*t)n=2;}
 else{const p=Math.random();n=p<.9?1:0;if(p<.5)n=2;if(p<.14)n=3;}
 BREAKS.push({a0,hw:.16+size*.18+Math.random()*.05,t:-1.4,reach:10+size*52+8*t,size,n,seed:Math.floor(Math.random()*999),done:false});}
function frontR(w,a){const u=Math.abs(angDiff(a,w.a0))/w.hw;if(u>=1)return wetR(a)+70;const prof=Math.cos(u*1.5708),t=w.t;let k;
 if(t<0)k=0;else if(t<1.1){const q=t/1.1;k=1-(1-q)*(1-q);}else if(t<1.6)k=1;else{const q=Math.min(1,(t-1.6)/1.4);k=1-q*q;}
 return wetR(a)+70*(1-k)-w.reach*prof*k;}
function coverBreak(w){S.shore=S.shore||[];const inArc=it=>Math.abs(angDiff(it.a,w.a0))<w.hw*.95;
 for(let i=S.shore.length-1;i>=0;i--){const it=S.shore[i];if(!inArc(it))continue;const fr=frontR(w,it.a);if(it.r>=fr-4&&Math.random()<.5)S.shore.splice(i,1);}
 for(let i=0;i<w.n;i++){const a=w.a0+(Math.random()-.5)*w.hw*1.4,r=Math.max(iR(a)-6,wetR(a)-6-Math.random()*(w.reach-10)),x=Math.cos(a)*r,y=Math.sin(a)*r;
  if(!walkable(x,y)||onDock(x,y)||Math.abs(x-R0)<60&&Math.abs(y)<60)continue;if(S.shore.some(q=>Math.hypot(q.x-x,q.y-y)<22))continue;
  const id=monNow()>.4&&Math.random()<.75?rollStormWash():rollWash();S.shore.push({a,r,x,y,id,n:id==='shells'?1+Math.floor(Math.random()*3):1,seed:Math.floor(Math.random()*999)});}
 while(S.shore.length>SHORE_MAX)S.shore.shift();save();}
function underFoam(it){for(const w of BREAKS)if(w.t>0&&w.t<3&&it.r>=frontR(w,it.a)-3)return true;return false;}
function tideUpdate(dt){tideGeom();if(ccOn||C||SH.on)return;if(tideLevel()<.5&&!S.journal.tide&&!dlgOn)discover('tide');
 breakT-=dt;if(breakT<=0){const m=monNow();breakT=(5.5+Math.random()*3.5)*(1-.5*m);if(BREAKS.length<(m>.4?4:3))spawnBreak();}
 for(const w of BREAKS){w.t+=dt;if(!w.done&&w.t>=1.6){w.done=true;coverBreak(w);if(w.n&&!S.st.sawWash){S.st.sawWash=1;think('The wave left something behind.');}}}
 for(const w of BREAKS){if(w.t<=0)continue;for(const s of SURF){const a=Math.atan2(s.y,s.x);if(Math.abs(angDiff(a,w.a0))>w.hw)continue;const r=Math.hypot(s.x,s.y),fr=frontR(w,a);
  if(s.hit!==w&&fr<=r+2){s.hit=w;s.had=s.st==='sparkle';s.st='wet';splash(s);}
  else if(s.hit===w&&w.t>1.6&&fr>r+6&&s.st==='wet'){s.st=WX.rain<.3&&Math.random()<(s.had?.18:.45)?'sparkle':'dry';}}}
 for(let i=BREAKS.length-1;i>=0;i--)if(BREAKS[i].t>3)BREAKS.splice(i,1);
 splashes=splashes.filter(p=>(p.t+=dt)<.7);}
let splashes=[];function splash(s){for(let i=0;i<7;i++)splashes.push({x:s.x+(Math.random()-.5)*s.rx*1.4,y:s.y-s.ry*.5,vx:(Math.random()-.5)*60,vy:-60-Math.random()*70,t:0});}
function drawSplashes(){for(const p of splashes){const k=p.t/.7;ctx.globalAlpha=1-k;dot(p.x+p.vx*p.t,p.y+p.vy*p.t+160*p.t*p.t,3-k*2,'#fff');}ctx.globalAlpha=1;}
function drawBreaks(){for(const w of BREAKS){const t=w.t;ctx.save();
 if(t<0){const q=(t+1.4)/1.4,pts=[];for(let i=0;i<=16;i++){const a=w.a0-w.hw+2*w.hw*i/16,r=wetR(a)+96-q*24+Math.sin(a*11+now*3)*2;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
  ctx.globalAlpha=.25+.55*q;ln(pts,w.seed,2+w.size*3.5,'#fff',1.4+w.size);ctx.restore();continue;}
 const pts=[],N=26;for(let i=0;i<=N;i++){const a=w.a0-w.hw+2*w.hw*i/N,r=frontR(w,a);pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
 for(let i=N;i>=0;i--){const a=w.a0-w.hw+2*w.hw*i/N,r=Math.min(wetR(a)+100,frontR(w,a)+64);pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
 ctx.globalAlpha=t>2.3?1-(t-2.3)/.7:1;sketch(pts,true,w.seed,3,'rgba(170,225,235,.55)',null);
 const fp=pts.slice(3,N-2);ln(fp,w.seed+1,4+w.size*6,'rgba(255,255,255,.85)',2.2);ln(fp,w.seed+2,2+w.size*1.5,'#fff',3);ctx.restore();}}
function drawShore(it){if(underFoam(it))return;shadow(it.x,it.y+2,10,3.5);ctx.drawImage(iconImg(itemIcon({id:it.id})),it.x-12,it.y-20+Math.sin(now*2+it.seed)*1.2,24,24);if(it.n>1)otext(String(it.n),it.x+11,it.y-2,12,'#fff');}
function grabShore(it){const i=(S.shore||[]).indexOf(it);if(i>=0&&!underFoam(it))sfx('grab');if(i<0||underFoam(it)){think(pick(['The sea took it back.','Too slow. Next wave.']));return;}
 /* a crate breaks open where it lies: planks, and whatever the sea left in it */
 if(it.id==='crate'){const n=2+Math.floor(Math.random()*2);if(!canAdd('plank',n)){think('No room in my pack for the planks.');return;}S.shore.splice(i,1);addItem('plank',n);sfx('chop');
  think(pick(['I prise it apart. Empty. Whatever it held, the sea had it first.','Stove in. Good planks, though.','Nothing inside but sand and a smell of tar.']));flies.push({id:'misc',img:'plank',x0:it.x,y0:it.y,t:0});
  S.st.found=S.st.found||{};S.st.found.crate=(S.st.found.crate||0)+1;S.st.washes=(S.st.washes||0)+1;addXP('foraging',washXP('crate'),'normal',[it.x,it.y-20]);discover('stormwash');save();return;}
 const got=addItem(it.id,it.n);if(!got){think('No room in my pack.');return;}if(got<it.n)it.n-=got;else S.shore.splice(i,1);
 flies.push({id:'misc',img:itemIcon({id:it.id}),x0:it.x,y0:it.y,t:0});const xp=washXP(it.id);if(STORMWASH.some(x=>x[0]===it.id&&!WASH.some(y=>y[0]===it.id)))discover('stormwash');
 const first=!hasSkill('foraging');if(first){unlockSkill('foraging');discover('foraging');toast('New skill: Foraging');}discover(it.id==='wood'?'driftwood':it.id==='kelp'?'kelp':'foraging');
 S.st.found=S.st.found||{};S.st.found[it.id]=(S.st.found[it.id]||0)+got;S.st.washes=(S.st.washes||0)+1;
 addXP('foraging',xp,first?'first':'normal',[it.x,it.y-20]);
 const close=BREAKS.some(w=>w.t>0&&w.t<1.6&&Math.abs(angDiff(it.a,w.a0))<w.hw);if(close)burst('foraging','Last second',8,[it.x,it.y-50]);save();}

/* salt sparkle: a wave that breaks on a hard surface sometimes leaves salt as it pulls back. It stays until the next wave hits that surface. Sand never holds it. */
const SURF=[];{const r=mulberry(31);rocks.forEach(k=>SURF.push({x:k.x,y:k.y,rx:k.rx,ry:k.ry,name:'Rocks',st:'dry',t:0}));
 [DOCK.x0+60,DOCK.x0+130,DOCK.x1-6].forEach(px=>SURF.push({x:px,y:DOCK.y1+6,rx:7,ry:5,name:'Dock piling',st:'dry',t:0,pile:1}));}
function drawSurf(){drawSplashes();for(const s of SURF){if(s.st==='dry')continue;if(Math.abs(s.x-cam.x)>W/Z/2+60||Math.abs(s.y-cam.y)>H/Z/2+60)continue;
 if(s.st==='wet'){ctx.globalAlpha=.22;blob(s.x,s.y-s.ry*.3,s.rx*.9,s.ry*.8,s.x,INK,0);ctx.globalAlpha=1;}
 else{for(let i=0;i<4;i++){const tw=.5+.5*Math.sin(now*9+i*1.9+s.x);ctx.globalAlpha=tw;const sx=s.x-s.rx*.6+((i*17+s.x)%(s.rx*1.2)),sy=s.y-s.ry*.6+((i*11)%(s.ry*1.1));dot(sx,sy,5*tw,'rgba(255,255,255,.35)');star(sx,sy,4.2,'#fff');}ctx.globalAlpha=1;}}}
function scrapeSalt(s){const c=s.pile?[s.x,DOCK.y1-8]:clampLand(s.x+s.rx+10,s.y+8);routeTo(c[0],c[1],()=>{if(s.st!=='sparkle'){think(pick(['Washed off. Wait for the next one.','Gone. The sea keeps its salt.']));return;}
 sfx('scrape');if(!addItem('seasalt',1)){think('No room in my pack.');return;}s.st='dry';pop('+1 sea salt',s.x,s.y-30,'#fff',17);
 const first=!hasSkill('foraging');if(first){unlockSkill('foraging');discover('foraging');toast('New skill: Foraging');}
 S.st.found=S.st.found||{};S.st.found.seasalt=(S.st.found.seasalt||0)+1;S.st.pinches=(S.st.pinches||0)+1;discover('seasalt');
 addXP('foraging',3,first?'first':'normal',[s.x,s.y-20]);save();});}

/* wash-ups from before the Key grew (build 28) were left inland: move them down to the strand line at the same bearing */
for(const it of (S.shore||[])){const a=it.a!=null?it.a:Math.atan2(it.y,it.x),r=Math.hypot(it.x,it.y);if(r<iR(a)-12){it.a=a;it.r=iR(a)-4-Math.random()*6;it.x=Math.cos(a)*it.r;it.y=Math.sin(a)*it.r;}}
/* ---------- the shell hatchet ----------
   The Key is sand: no flint, almost no stone. Islanders on low sandy atolls made adze blades from giant clam shell,
   the thick hinge ground down on rock with sand and seawater. Here: pry an empty giant clam shell off a reef with a
   driftwood stick, grind its hinge on the rocks (wet sand does the cutting; slow, and progress keeps between visits),
   then lash the blade to driftwood with kelp twine. */
const GRIND_N=48,CLAM_BACK=15*60000;
var GRD=null,grindDust=[];
/* the three reefs nearest the Key each hold one old, empty shell; prying it out leaves room for another to show later */
var CLAMS=null;
function clams(){if(!CLAMS)CLAMS=KFEAT.filter(f=>f.kind==='reef').sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y)).slice(0,3).map((f,i)=>({i,x:f.x+f.rx*.15,y:f.y,seed:300+i}));return CLAMS;}
function clamHere(c){return !((S.clam||{})[c.i]>Date.now()-CLAM_BACK);}
/* flint from older saves becomes a blade, so nobody loses their start */
for(const it of S.inv)if(it.id==='flint')it.id='shellblade';
function clamObjects(o){for(const c of clams()){if(!clamHere(c))continue;o.push({x:c.x,y:c.y-6,r:22,name:'Giant clam shell',key:'clam',act:'Pry it loose',onAct:()=>walkStraight(c.x-18,c.y+6,()=>pryClam(c)),onExamine:()=>{discover('clam');think(pick(['An old giant clam shell, long empty, wedged into the reef. The hinge is thick as my wrist.','Ribbed and heavy. Nothing lives in it now.']));}});}}
function pryClam(c){if(!clamHere(c))return;if(Math.hypot(P.x-c.x,P.y-c.y)>60){think('I need to stand right by it.');return;}
 if(!(cnt('wood')>0)){think(pick(['Wedged fast in the reef. I need something to lever it with.','My fingers will not shift it. A stick, maybe.']));return;}
 if(!canAdd('clamshell')){think('No room in my pack.');return;}
 S.clam=S.clam||{};S.clam[c.i]=Date.now();addItem('clamshell');sfx('scrape');flies.push({id:'misc',img:'clamshell',x0:c.x,y0:c.y,t:0});discover('clam');
 const first=!hasSkill('foraging');if(first){unlockSkill('foraging');discover('foraging');toast('New skill: Foraging');}addXP('foraging',4,first?'first':'normal',[c.x,c.y-20]);

/* ---------- the longaxe (build 41) ----------

   long driftwood haft, dry kelp for the lashing. Wobblewood makes a better haft later (springier, tougher, one more
   splice). Two ends: the blade slices (Strife, and chopping); the haft knocks things down (blunt) and, at its longest
   reach, prods (the gentle use for now, until Accord is redesigned).
   Every use wears the part doing the work. The lashing frays, then snaps and the head flies off (into the sand, or
   lost in water). The head dulls; a regrind at the rocks restores it but leaves it smaller, so it cuts a little worse
   for good, and after three it is ground away. The haft cracks; a splice holds it but shortens it, so it reaches a
   little less for good, and past its splices it needs replacing. A full rebuild is fresh again. Wear shows on the axe

function axeNew(){return {h:{w:0,g:0},f:{k:'drift',w:0,s:0,cr:0},l:{w:0}};}

   the ground (a low-resolution top-down image of the realm, built once), you as an arrow, and only what you have met
   or been told: dwellers you know, things lying on the ground, your lit fires, the tracked quest's next spot (an arrow
   on the rim when it is off the map). Where you have not been is dark: exploring is what draws the map, and what you
   have seen is saved (S.mm, a run-length string per realm). Tap it to walk there; tap the sea to walk to the nearest
   shore (or swim there if swimming). Long-press it for the full Map tab. It can be hidden from the You tab. */

/* the phone's safe area, measured once from a probe */let MMSAFE=null;function mmSafe(){if(MMSAFE)return MMSAFE;const d=document.createElement('div');d.style.cssText='position:fixed;top:0;right:0;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);visibility:hidden';document.body.appendChild(d);const cs=getComputedStyle(d);MMSAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0};d.remove();return MMSAFE;}

function mmBox(r){if(r==='key')return {x0:-1250,y0:-1250,x1:1250,y1:1250};let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const I of ISLES){x0=Math.min(x0,I.x-I.rx*1.3);x1=Math.max(x1,I.x+I.rx*1.3);y0=Math.min(y0,I.y-I.ry*1.3);y1=Math.max(y1,I.y+I.ry*1.3);}return {x0,y0,x1,y1};}
function mmPos(){const sa=mmSafe();return {cx:W-MMR-14-sa.r,cy:MMR+14+sa.t};}

/* the ground, top down: sea by depth, then each kind of ground in its colour, with the shore inked */
function mmImage(r){if(MM.img[r])return MM.img[r];const B=mmBox(r),st=8,w=Math.ceil((B.x1-B.x0)/st),h=Math.ceil((B.y1-B.y0)/st),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),D=im.data;
 const COL={1:[243,210,122],2:[132,196,96],3:[170,186,96],4:[96,150,84],5:[168,160,170]};
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const x=B.x0+i*st,y=B.y0+j*st,o=(j*w+i)*4;let c3;
  if(r==='key'){const hh=hKey(x,y);if(hh>0||onIsland(x,y)){const m=keyMat(x,y,hh);c3=COL[m]||COL[2];const f=m===1?1:1+Math.min(1,hh/100)*.18;c3=c3.map(v=>Math.min(255,v*f));}else{const d=seaDepth(x,y);c3=d<.35?[150,214,214]:d<.7?[96,178,196]:[58,132,170];}}

/* explored cells, saved as a run-length string */
function mmGrid(r){if(MM.seen[r])return MM.seen[r];const B=mmBox(r),w=Math.ceil((B.x1-B.x0)/MMC),h=Math.ceil((B.y1-B.y0)/MMC),a=new Uint8Array(w*h);S.mm=S.mm||{};const s=S.mm[r];

function mmMarks(){const m=[],j=S.journal||{};if(SH.on){for(const f of PLANTED)m.push([f.x,f.y,'#6fbf4a',2.5]);}

function drawMinimap(dt){mmSize();if(!mmShown())return;mmTick(dt);const r=mmRealm(),{cx,cy}=mmPos(),I=mmImage(r),F=mmFog(r),k=MMK;
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,MMR,0,6.2832);ctx.fillStyle='#1e1834';ctx.fill();ctx.clip();

 /* you: an arrow the way you last moved */const a=P.hd!=null?P.hd:(P.face<0?Math.PI:0);ctx.save();ctx.translate(cx,cy);ctx.rotate(a);ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,4);ctx.lineTo(-2,0);ctx.lineTo(-4,-4);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
 ctx.restore();
 /* the tracked quest: a mark on the map, or an arrow on the rim pointing the way */
 const q=typeof questMarks==='function'?questMarks():[];if(q.length&&!SH.on){let best=null,bd=1e9;for(const s of q){const d=Math.hypot(s[0]-P.x,s[1]-P.y);if(d<bd){bd=d;best=s;}}const dx=best[0]-P.x,dy=best[1]-P.y,d=Math.hypot(dx,dy)*k;
