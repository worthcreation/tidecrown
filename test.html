<style>
:root{--ink:#2a2140;--paper:#fffaf0;--paper2:#f4e9cf;--sea:#3fa7b8;--coral:#ff6b6b;--sun:#ffcf3a;--muted:#6b5f86;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#f3ead8;--paper2:#e4d6b8;}}
:root[data-theme="dark"]{--paper:#f3ead8;--paper2:#e4d6b8;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.sk{background:var(--paper);border:3px solid var(--ink);border-radius:18px 7px 20px 9px/9px 20px 7px 18px;box-shadow:3px 4px 0 var(--ink)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);font-size:22px;line-height:1.2;text-align:center;width:min(86vw,420px);color:#fff;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);
  pointer-events:none;opacity:0;transition:opacity .6s}
#hint.on{opacity:1}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translate(-50%,-14px);opacity:0;visibility:hidden;padding:5px 16px;font-size:18px;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s,visibility .3s;pointer-events:none;white-space:nowrap;z-index:9}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
#bag{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:56px;height:56px;padding:0;border:none;background:none;opacity:.88;z-index:4}
#bag svg{width:100%;height:100%;overflow:visible}
#snd{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:42px;height:42px;padding:0;border:none;background:none;opacity:.7;z-index:4}
#snd svg{width:100%;height:100%;overflow:visible}#snd .x{display:none}#snd.off .x{display:block}#snd.off{opacity:.45}
#bag.pulse{animation:pulse .9s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.2) rotate(-7deg)}}
#ctx{position:fixed;display:none;flex-direction:column;padding:4px 4px 6px;min-width:150px;z-index:6}
#ctx .t{font-size:15px;color:var(--muted);padding:4px 12px 0}
#ctx button,.opt{font-size:21px;background:none;border:none;text-align:left;padding:7px 12px;border-radius:10px 5px 11px 6px}
#ctx button:active,.opt:active,.opt:hover,#ctx button:hover{background:var(--paper2)}
#dlg{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:520px;margin:0 auto;padding:10px 14px 8px;display:none;z-index:6}
#dlg .who{font-size:17px;color:var(--muted)}
#dlg .opts{display:flex;flex-direction:column}
.opt::before{content:'\203A  ';color:var(--coral)}
#scrim{position:fixed;inset:0;background:rgba(42,33,64,.22);display:none;z-index:7}
#bank{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:460px;margin:0 auto;z-index:8;display:none;flex-direction:column;padding:8px 12px 12px;overflow:hidden}
#bank.on{display:flex}
.bhead{display:flex;align-items:center;gap:8px;flex:none}
.bhead b{font-weight:400;font-size:22px;flex:1}
.bmode{display:flex;border:2px solid var(--ink);border-radius:11px 5px 10px 6px;overflow:hidden}
.bmode button{font-size:16px;background:none;border:none;padding:2px 10px}
.bmode button.on{background:var(--sun)}
.bsub{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;color:var(--muted);font-size:16px;flex:none}
.bsub button{font-size:16px;background:var(--paper2);border:2px solid var(--ink);border-radius:11px 5px 10px 6px;padding:2px 10px;color:var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(6,var(--bs,48px));gap:6px;justify-content:center;flex:none}
.bgrid .slot{width:var(--bs,48px);height:var(--bs,48px);aspect-ratio:auto;position:relative}
.bgrid .slot img{width:82%;pointer-events:none}
.bgrid .cnt{position:absolute;bottom:1px;right:4px;font-style:normal;font-size:13px;line-height:1;text-shadow:0 0 2px #fffaf0,0 0 2px #fffaf0}
.bnote{text-align:center;color:var(--muted);font-size:15px;margin-top:6px;min-height:18px;flex:none}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;width:min(360px,calc(100vw - 20px));transform:translateX(118%);transition:transform .35s cubic-bezier(.3,1.2,.5,1);z-index:8;display:flex;flex-direction:column;overflow:hidden}
#panel.on{transform:none}
.tabs{display:flex;gap:2px;padding:6px 8px 0;align-items:center}
.tab{flex:1;font-size:19px;background:none;border:none;color:var(--muted);padding:6px 0 4px;border-bottom:3px solid transparent;border-radius:0}
.tab.on{color:var(--ink);border-bottom-color:var(--coral)}
.x{background:none;border:none;font-size:26px;width:40px;line-height:1}
.skill{display:flex;gap:12px;align-items:center;padding:6px 0 12px}
.skill img{width:52px;height:52px}
.skill.hid{opacity:.6}
.skill .q{width:52px;height:52px;display:grid;place-items:center;font-size:30px;border:2.5px dashed var(--ink);border-radius:50% 45% 52% 48%;flex:none;color:var(--muted)}
.sdesc.pd{flex:none;margin-bottom:10px}
.skill .m{flex:1}
.skill .top{display:flex;justify-content:space-between;font-size:21px}
.bar{height:15px;border:2.5px solid var(--ink);border-radius:9px 4px 10px 5px;overflow:hidden;background:var(--paper2);margin:3px 0}
.bar i{display:block;height:100%;background:var(--sea)}
.skill small{font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1;border:2.5px dashed rgba(42,33,64,.3);border-radius:13px 6px 12px 7px;display:grid;place-items:center;background:none;padding:0}
.slot.f{border-style:solid;border-color:var(--ink);background:var(--paper2)}
.slot.sel{background:var(--sun)}
.slot img{width:84%;pointer-events:none}
.ent{padding:8px 0;border-bottom:2px dashed rgba(42,33,64,.18)}
.ent b{font-size:20px}
.ent p{margin:2px 0 0;line-height:1.3;color:#4a3f63}
.muted{color:var(--muted)}
#cc{position:fixed;inset:0;z-index:20;display:none;background:linear-gradient(#bfe6ee,#3fa7b8);padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px);overflow:auto}
#cc.on{display:flex;align-items:center;justify-content:center}
#cc .card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:7px;padding:10px 11px 12px}
#cc h1{font-size:28px;font-weight:400;margin:0;text-align:center;line-height:1}
.cctop{display:flex;gap:10px;align-items:center}
#pv{position:static;inset:auto;width:112px;height:124px;flex:none;touch-action:auto}
.ccid{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccid .sub{color:var(--muted);font-size:16px;line-height:1.15}
.namerow{display:flex;gap:6px;align-items:center}
.namerow input{flex:1;font:inherit;font-size:21px;color:var(--ink);background:var(--paper2);border:2.5px solid var(--ink);border-radius:12px 5px 11px 6px;padding:3px 8px;min-width:0;height:40px}
.dice{font-size:22px;min-width:42px;height:40px;background:var(--sun);border:2.5px solid var(--ink);border-radius:12px 6px 13px 7px;padding:0 10px}
#ccrand{font-size:18px;height:36px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.pk{display:flex;align-items:center;border:2.5px solid var(--ink);border-radius:14px 6px 13px 7px;background:var(--paper2);height:44px;min-width:0}
.pk button{width:30px;height:100%;background:none;border:none;font-size:26px;line-height:1;flex:none;padding:0}
.pk button:active{background:var(--sun)}
.pk .val{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1.05}
.pk .val small{font-size:13px;color:var(--muted)}
.pk .val span{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:4px}
.pk .val.lock span{color:var(--muted)}
.sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none;display:inline-block}
.lockhint{min-height:19px;text-align:center;color:var(--muted);font-size:16px;line-height:1.15}
#ccgo{align-self:center;font-size:22px;padding:5px 24px;background:var(--coral);color:#fff}
#ccgo:disabled{opacity:.45}
.origins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 2px}
.org{text-align:left;padding:10px 12px 11px;font-size:15px;line-height:1.25;display:flex;flex-direction:column;gap:5px}
.otop{margin-top:2px}.otop #pv{width:96px;height:108px}
.org b{font-size:19px;font-weight:400;line-height:1.05}
.org .keep{color:var(--muted)}
.org.on{background:var(--sun)}
.odetail{flex:1;min-height:38px;text-align:left;font-size:16px;color:#4a3f63;line-height:1.2}.odetail b{font-weight:400;color:var(--ink)}
#cc .back{background:none;border:none;color:var(--muted);font-size:17px;text-decoration:underline;align-self:center;padding:4px 0 0}
@media (max-height:600px){#pv{width:92px;height:100px}#cc h1{font-size:24px}.ccid .sub{display:none}.pk{height:40px}.otop #pv{width:72px;height:82px}.origins{gap:7px}.org{padding:7px 9px 8px;gap:3px;font-size:14px}.org b{font-size:17px}.odetail{font-size:15px}}
#pbody{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:10px 14px 12px;font-size:19px}
#pbody .grid{grid-template-columns:repeat(4,var(--s,64px));justify-content:center;gap:8px;flex:none}
#pbody .grid+.grid{margin-top:14px}
#pbody .slot{width:var(--s,64px);height:var(--s,64px);aspect-ratio:auto;position:relative}
.slot .tag{position:absolute;top:3px;left:6px;font-size:12px;color:var(--muted);line-height:1}
.gearE{border-style:dotted!important;border-color:rgba(42,33,64,.5)!important;background:rgba(255,207,58,.1)}
#pbody .info{flex:1 1 auto;min-height:126px;margin-top:10px;overflow:hidden;padding-bottom:4px}
#pbody .info b{font-size:20px}
#pbody .slot .cnt{position:absolute;bottom:1px;right:5px;font-style:normal;font-size:15px;line-height:1;color:var(--ink);text-shadow:0 0 2px #fffaf0,0 0 2px #fffaf0}
#pbody .info p{margin:0 0 8px;font-size:17px;line-height:1.3;padding-bottom:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{font-size:17px;padding:3px 11px;background:var(--paper2);border:2px solid var(--ink);border-radius:12px 5px 11px 6px}
.acts button:active{background:var(--sun)}
.lockt{margin:0}
.lockrow{display:flex;justify-content:space-between;gap:8px;margin:8px 0 10px}
.lk{flex:1;aspect-ratio:1;max-width:56px;font-size:26px;background:none;border:2.5px dashed var(--ink);border-radius:50% 45% 52% 48%;color:var(--muted);padding:0}
.lk.sel{background:var(--sun);color:var(--ink);border-style:solid}
.clue{min-height:46px;text-align:center;font-size:18px;color:#4a3f63;line-height:1.2}
.jhead{margin:0 0 2px;flex:none}
.jlist{flex:1;min-height:0;overflow:hidden}
.pager{display:flex;align-items:center;justify-content:space-between;padding-top:8px;flex:none}
.pager button{width:46px;height:40px;font-size:26px;line-height:1;background:none;border:2.5px solid var(--ink);border-radius:50% 45% 52% 48%;padding:0}
.pager button:disabled{opacity:.25}
.pager span{color:var(--muted);font-size:17px}
#dlg .say{font-size:20px;line-height:1.25;margin:2px 0 4px}
#dlg .opt{padding:5px 10px;font-size:19px}

.you{display:flex;flex-direction:column;flex:1;min-height:0}
.youdoll{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.youdoll img{width:84px;height:102px;flex:none}
.youname{display:flex;flex-direction:column;gap:2px;font-size:17px}
.youname b{font-size:21px}
.youname small{color:var(--muted);font-size:15px}
#pbody .grid.g3{grid-template-columns:repeat(3,50px);gap:6px}
#pbody .grid{touch-action:none}#pbody img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}#pbody .slot{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}#pbody .gearE{background:none;border-style:dashed}#pbody .slot.dgsrc{opacity:.35}#pbody .slot.over{background:var(--sun);border-style:solid;border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,207,58,.6)}
.dgghost{position:fixed;z-index:30;width:96px;height:96px;margin:-78px 0 0 -48px;pointer-events:none;background:none;border:none;display:grid;place-items:center;filter:drop-shadow(0 4px 0 rgba(42,33,64,.25))}.dgghost img{width:96px;height:96px;opacity:.95}
#pbody .grid.g3 .slot{width:50px;height:50px}
.slot.none{border:none;background:none}
.you .info{margin-top:8px;flex:1;min-height:0;overflow:hidden}

.mapc{width:100%;flex:1;min-height:0;border:2.5px solid var(--ink);border-radius:14px 8px 12px 9px;touch-action:manipulation}
#cookbar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
#cookbar>*{pointer-events:auto}
.fuel{position:relative;width:76px;height:76px;padding:0;display:grid;place-items:center;border-radius:50% 46% 52% 48%!important;transition:transform .12s}
.fuel img{width:46px;height:46px;pointer-events:none}
.fuel b{position:absolute;top:-6px;right:-6px;min-width:26px;font-weight:400;font-size:17px;background:var(--sun);border:2.5px solid var(--ink);border-radius:12px;padding:0 5px;line-height:1.25}
.fuel.empty{opacity:.45}
.fuel.pop{transform:scale(.88)}
.fuel .kd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:13px;background:#fffaf0;border:2px solid var(--ink);border-radius:9px;padding:0 6px;white-space:nowrap;display:none}
.fuel.auto .kd{display:block}
.cmid{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px 6px;font-size:16px;white-space:nowrap;margin-bottom:4px}
.cmid button{font-size:18px;background:var(--coral);color:#fff;border:2.5px solid var(--ink);border-radius:12px 6px 13px 7px;padding:1px 12px}
#buffb{position:fixed;right:calc(env(safe-area-inset-right,0px) + 80px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:44px;height:44px;border-radius:50%;padding:4px;border:none;display:none;z-index:4;background:conic-gradient(#ffcf3a calc(var(--p,100)*1%),rgba(42,33,64,.18) 0)}
#buffb span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
#buffb img{width:28px;height:28px;pointer-events:none}
#buffb.low{animation:pulse 1.2s ease-in-out infinite}
.sellg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin:4px 0 8px}
.st{position:relative;height:44px;background:var(--paper2);border:2px solid var(--ink);border-radius:11px 5px 10px 6px;padding:0;display:grid;place-items:center}
.st.on{background:var(--sun)}
.st img{width:82%;pointer-events:none}
.st b{position:absolute;bottom:-6px;right:-5px;font-size:12px;font-weight:400;background:#fffaf0;border:1.5px solid var(--ink);border-radius:8px;padding:0 4px;line-height:1.2}
.sellrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sellrow button{font-size:18px;padding:3px 12px;background:var(--paper2);border:2px solid var(--ink);border-radius:12px 5px 11px 6px}
.sellrow .go{background:var(--coral);color:#fff}
.sellrow .go:disabled{opacity:.45}
.skb{width:100%;text-align:left;background:none;border:none;padding:6px 0 10px;border-bottom:2px dashed rgba(42,33,64,.15);border-radius:0}
.skb:active{background:var(--paper2)}
.skb .chev{font-size:28px;color:var(--muted);padding-left:4px}
.back2{background:none;border:none;font-size:18px;color:var(--muted);padding:0 0 2px;text-align:left;flex:none}
#pbody .skill{padding:4px 0 6px;flex:none}
.sdesc{margin:0 0 6px;font-size:17px;line-height:1.22;color:#4a3f63;flex:0 1 4.9em;min-height:2.5em;overflow:hidden}
.sh{font-size:15px;color:var(--muted);margin:2px 0 4px}
.ways{display:flex;gap:8px;flex:none;margin-bottom:6px}.way{display:flex;flex-direction:column;align-items:center;gap:1px;width:64px;padding:4px 2px 3px;background:#fffaf0;border:2px solid var(--ink);border-radius:12px 5px 11px 6px}.way img{width:34px;height:34px}.way small{font-size:12px;color:var(--ink);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}.way.hid{background:none;border-style:dashed;color:var(--muted)}.way.hid .q{font-size:24px;line-height:34px;height:34px}.way.hid small{color:var(--muted)}.way.hid.sel{background:var(--sun);border-style:solid}
.moves{display:flex;flex-direction:column;gap:6px;flex:none}.mv{display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:5px 10px;background:var(--paper2);border:2px solid var(--ink);border-radius:12px 5px 11px 6px;line-height:1.15}.mv b{font-weight:400;font-size:18px}.mv span{color:var(--muted);font-size:16px}.mv small{grid-column:1/3;font-size:14px;color:var(--muted)}
.disc{display:flex;gap:5px;margin-bottom:6px;flex:none}
.dx{padding:0;position:relative;width:40px;height:40px;background:var(--paper2);border:2px solid var(--ink);border-radius:11px 5px 10px 6px;display:grid;place-items:center;flex:none}
.dx img{width:90%;pointer-events:none}
.dx.sel{background:var(--sun)}
.sdesc.dd{font-size:16px;line-height:1.25;color:var(--ink)}
.dx img.sil{filter:brightness(0);opacity:.18}
.dx i{position:absolute;bottom:-3px;right:-4px;font-style:normal;font-size:12px;background:var(--sun);border:1.5px solid var(--ink);border-radius:8px;padding:0 3px;line-height:1.2}
.ach{display:flex;flex-wrap:wrap;gap:4px 14px;flex:none}
.ach button{display:flex;align-items:center;gap:6px;font-size:17px;line-height:1.3;background:none;border:none;padding:1px 4px 1px 0;border-radius:8px 4px 9px 5px;color:var(--muted)}
.ach button.ok{color:var(--ink)}
.ach button.sel{background:var(--sun);color:var(--ink)}
.ach .ck{width:17px;height:17px;border:2px solid var(--ink);border-radius:5px 3px 6px 3px;flex:none;display:grid;place-items:center;font-size:13px;line-height:1}
.ach .ok .ck{background:var(--sun)}
.ach b{font-weight:400}
.next{margin-top:8px;padding:6px 10px;background:var(--paper2);border:2px dashed rgba(42,33,64,.35);border-radius:12px 5px 11px 6px;font-size:17px;line-height:1.25;flex:none}
@media (prefers-reduced-motion:reduce){#panel,#toast{transition:none}#bag.pulse{animation:none}}
/* test build: the Test tab (allowed to scroll, test only) */

<script>
(()=>{
const MODE='test';
const INK='#2a2140';
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
let W=0,H=0,DPR=1,Z=1,ZB=1,camZ=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);dk.width=cv.width;dk.height=cv.height;ZB=Math.max(.85,Math.min(1.4,Math.min(W,H)/430));Z=ZB*camZ;}
addEventListener('resize',resize);resize();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- hand-drawn primitives ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let now=0,boil=0;
function sketch(pts,closed,seed,amp,fill,stroke,lw){
  const r=mulberry(seed*9973+boil*7919+1);
  const q=pts.map(p=>[p[0]+(r()-.5)*amp,p[1]+(r()-.5)*amp]);
  const n=q.length;ctx.beginPath();
  if(closed){let a=q[n-1],b=q[0];ctx.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);
    for(let i=0;i<n;i++){a=q[i];b=q[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}ctx.closePath();}
  else{ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<n-1;i++){const a=q[i],b=q[i+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}ctx.lineTo(q[n-1][0],q[n-1][1]);}
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
}
function ell(x,y,rx,ry,n){const a=[];n=n||14;for(let i=0;i<n;i++){const t=i/n*6.2832;a.push([x+Math.cos(t)*rx,y+Math.sin(t)*ry]);}return a;}
function blob(x,y,rx,ry,seed,fill,lw,amp){sketch(ell(x,y,rx,ry,Math.max(8,Math.round((rx+ry)/3))),true,seed,amp==null?Math.min(3,(rx+ry)*.08):amp,fill,lw===0?null:INK,lw==null?3:lw);}
function ln(pts,seed,lw,col,amp){const o=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];o.push(a,[a[0]+(b[0]-a[0])/3,a[1]+(b[1]-a[1])/3],[a[0]+(b[0]-a[0])*2/3,a[1]+(b[1]-a[1])*2/3]);}o.push(pts[pts.length-1]);sketch(o,false,seed,amp==null?1.6:amp,null,col||INK,lw||3);}
function rrPts(x,y,w,h,r){const p=[];const c=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];for(const [cx,cy,a0] of c){for(let i=0;i<=2;i++){const a=a0+i/2*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}}return p;}
function dot(x,y,r,col){ctx.fillStyle=col||INK;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.fill();}
function otext(t,x,y,size,fill,stroke){ctx.font=size+"px 'Patrick Hand','Comic Sans MS',cursive";ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=stroke||INK;ctx.strokeText(t,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(t,x,y);}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return d;}
function star(x,y,r,col){ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*6.2832-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function wrap(t,maxW){const words=t.split(' ');const lines=[];let cur='';for(const w of words){const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tst;}if(cur)lines.push(cur);return lines;}

/* ---------- world ---------- */
/* KSC: the Key's size (build 28 made it 67% larger) */
const KSC=1.67;
function iR(a){return KSC*(520+60*Math.sin(3*a+1)+35*Math.sin(5*a+2.3)+20*Math.sin(9*a+.7));}
function gR(a){return iR(a)*.8+14*Math.sin(7*a+1.3)-10;}
function polar(a,r){return [Math.cos(a)*r,Math.sin(a)*r];}
const NP=150,sandPts=[],grassPts=[],shallowPts=[],foamPts=[];
for(let i=0;i<NP;i++){const a=i/NP*6.2832,c=Math.cos(a),s=Math.sin(a);sandPts.push([c*iR(a),s*iR(a)]);grassPts.push([c*gR(a),s*gR(a)]);shallowPts.push([c*(iR(a)+60),s*(iR(a)+60)]);foamPts.push([c*(iR(a)+9),s*(iR(a)+9)]);}
const R0=iR(0);
/* tide: 1 is high water, 0 is low. Low water exposes a wet band of TIDE_REACH outside the dry sand. */
/* a day is 24 minutes; like real tides there are two highs a day, so the tide cycles every 12 and the water is always on the move. */
const DAY_PERIOD=24*60000,TIDE_PERIOD=DAY_PERIOD/2,TIDE_REACH=46;let tideF=null;
var DAYOFF=0;/* test build only: shifts the time of day */
function tideLevel(){if(tideF!=null)return tideF;return .5+.5*Math.cos(Date.now()/TIDE_PERIOD*6.2832);}
function wetR(a){return iR(a)+(1-tideLevel())*TIDE_REACH;}
const DOCK={x0:R0-40,x1:R0+192,y0:-24,y1:24};
function onIsland(x,y){return Math.hypot(x,y)<=wetR(Math.atan2(y,x))-10;}
function onDock(x,y){return x>=DOCK.x0&&x<=DOCK.x1-10&&y>=DOCK.y0+6&&y<=DOCK.y1-6;}
const SH={on:false};
function walkable(x,y){if(SH.on)return shWalkable(x,y);return onIsland(x,y)||onDock(x,y)||!!onIsletK(x,y);}
function clampLand(x,y){if(SH.on)return shClamp(x,y);if(walkable(x,y))return[x,y];const a=Math.atan2(y,x);return polar(a,wetR(a)-18);}

/* fishing spots roam: a spot fades in, lives a couple of minutes, fades out, and a new one bubbles up somewhere else. The glowing pool is a place and stays put. */
const spots=[];
function spotHere(a,type){const p=polar(a,iR(a)+60),ap=polar(a,iR(a)-24);return {x:p[0],y:p[1],ax:ap[0],ay:ap[1],type,seed:Math.floor(Math.random()*900)+5,a,al:0,st:'in',life:120+Math.random()*180};}
function spotAngle(type){for(let i=0;i<40;i++){let a;if(type==='deep')a=-2.7+Math.random()*1.2;else{a=Math.random()*6.2832;if(a>Math.PI)a-=6.2832;if(Math.abs(a)<.5||(a<-1.4&&a>-2.8)||Math.abs(Math.abs(a)-Math.PI)<.4)continue;}
 if(spots.some(s=>Math.abs(angDiff(s.a,a))<.42))continue;return a;}return null;}
function addSpot(a,type){spots.push(spotHere(a,type));}
addSpot(.85,'shallow');addSpot(2.35,'shallow');addSpot(-1.85,'deep');addSpot(-2.35,'deep');
spots.push({x:polar(Math.PI,iR(Math.PI)+60)[0],y:polar(Math.PI,iR(Math.PI)+60)[1],ax:polar(Math.PI,iR(Math.PI)-24)[0],ay:polar(Math.PI,iR(Math.PI)-24)[1],type:'moon',seed:57,a:Math.PI,al:1,st:'on',life:1e9});
spots.push(spotHere(.42,'shallow'));
const MOON=spots.find(s=>s.type==='moon');
function spotsUpdate(dt){for(const sp of spots){if(sp.type==='moon')continue;
 if(sp.st==='in'){sp.al=Math.min(1,sp.al+dt/2.5);if(sp.al>=1)sp.st='on';}
 else if(sp.st==='on'){sp.life-=dt;if(sp.life<=0)sp.st='out';}
 else{sp.al=Math.max(0,sp.al-dt/2.5);}}
 for(let i=spots.length-1;i>=0;i--){const sp=spots[i];if(sp.st==='out'&&sp.al<=0){spots.splice(i,1);const a=spotAngle(sp.type);if(a!=null)spots.push(spotHere(a,sp.type));}}}
const REQ={shallow:1,deep:10,moon:20};

const G={x:R0+170,y:-2,talk:false};
const SIGN={x:R0-95,y:-58};
/* Brimble's camp: a flat shelf on the lee (west) shoulder of the hill near the middle of the Key, just below its
   crown: out of the east wind and spray, a few steps from a lookout over the whole horizon (HILL in 30-terrain) */
const OLDFIRE=(()=>{const p=polar(-.95,iR(-.95)-42);return{x:Math.round(p[0]),y:Math.round(p[1])};})();
const HILL={x:50*KSC,y:-70*KSC};
const FIRE={x:-135*KSC,y:-62*KSC};
const HEAD=(()=>{const a=Math.PI-.45,p=polar(a,iR(a)-70);return{x:p[0],y:p[1]};})();
const POOL=(()=>{const p=polar(2.05,250*KSC);return{x:p[0],y:p[1]};})();
const GULL={x:R0-150,y:-34};
const crabHome=polar(1.6,iR(1.6)-60);
const CRAB={x:crabHome[0],y:crabHome[1],tx:crabHome[0],ty:crabHome[1],wait:1,hop:0};
const rocks=[];
[-1.85,-2.35].forEach((a,j)=>{[-.09,-.03,.05,.1].forEach((d,i)=>{const p=polar(a+d,iR(a+d)+(i%2?2:-8));rocks.push({x:p[0],y:p[1],rx:14+((i*7+j*3)%9),ry:10+((i*5)%6),seed:200+j*10+i});});});
/* the windward east shore is rockier */
[-.62,-.45,-.3,.32,.48,.66].forEach((a,i)=>{const p=polar(a,iR(a)-4);rocks.push({x:p[0],y:p[1],rx:13+(i*5)%8,ry:9+(i*3)%5,seed:240+i});});
/* a low outcrop on the windward (east) edge of Brimble's shelf */
/* set back behind the tripod, so the camp reads in front of them */
[[74,-40,16,11],[104,-28,13,9],[90,-54,11,8]].forEach(([dx,dy,rx,ry],i)=>rocks.push({x:FIRE.x+dx,y:FIRE.y+dy,rx,ry,seed:260+i,camp:1}));

const trees=[];
{const r=mulberry(7);let tries=0;const avoid=[[GULL.x,GULL.y],[POOL.x,POOL.y],[R0-80,24],[OLDFIRE.x,OLDFIRE.y],[SIGN.x,SIGN.y],[HEAD.x,HEAD.y],[R0-25,0],crabHome,...spots.map(s=>[s.ax,s.ay])];
 while(trees.length<18&&tries<800){tries++;const a=r()*6.2832,d=Math.sqrt(r())*.74;const x=Math.cos(a)*gR(a)*d,y=Math.sin(a)*gR(a)*d;
  if(avoid.some(p=>Math.hypot(p[0]-x,p[1]-y)<120))continue;if(trees.some(t=>Math.hypot(t.x-x,t.y-y)<90))continue;
  trees.push({x,y,s:.85+r()*.45,seed:trees.length*31+3,lean:(r()-.5)*18,hue:r()});}
}
const tufts=[];{const r=mulberry(11);for(let i=0;i<150;i++){const a=r()*6.2832,d=Math.sqrt(r())*.93;tufts.push({x:Math.cos(a)*gR(a)*d,y:Math.sin(a)*gR(a)*d,f:r()<.18,seed:i+500,c:r()});}}
const waves=[];{const r=mulberry(23);for(let i=0;i<300;i++){const a=r()*6.2832,d=iR(a)+110+r()*(i<140?1100:4300);waves.push({x:Math.cos(a)*d,y:Math.sin(a)*d,s:r()*6,seed:i+900});}}

/* ---------- game data ---------- */
const FISH={
 minnow:{name:'Minnowbit',lvl:1,xp:12,win:900,w:10,col:'#a9dbe9',val:2,spot:'shallow',desc:'Small, silver, and mildly offended to be here.'},
 perch:{name:'Pebble Perch',lvl:5,xp:22,win:760,w:6,col:'#d4ab6f',val:4,spot:'shallow',desc:'Speckled like a beach. Tastes a bit like one, too.'},
 grump:{name:'Grumpfish',lvl:10,xp:40,win:660,w:8,col:'#8f84c0',val:7,spot:'deep',desc:'Has never once been happy about anything. Respect.'},
 eel:{name:'Jellybean Eel',lvl:15,xp:60,win:560,w:5,col:'#ff8fb1',val:10,spot:'deep',desc:'Wiggly, striped, and faintly sugary.'},
 koi:{name:'Moonkoi',lvl:20,xp:120,win:520,w:1,col:'#eef3ff',val:25,spot:'moon',desc:'Glows softly. Looks at you like it knows something you don\u2019t.'}
};
const BOTTLES=[
 'If you\u2019re reading this, the Lantern Sea took you too. Don\u2019t be scared. It only takes people it has plans for. \u2014 C.',
 'Day forty. The stone head on the Key sings at night. I think it\u2019s singing directions.',
 'The Far Light is real. I saw it once from the crow\u2019s nest, and it blinked back. Keep going. \u2014 C.'
];
const JOURNAL={
 washed:['Washed ashore','Woke up on warm sand with salt in my ears and no idea how I got here. There\u2019s a dock. There\u2019s a bucket on the dock. The bucket is looking at me.'],
 gubbins:['Gubbins','A talking bucket who lives on the dock. Eats fish whole, pays in shells, claims he was once a very important bucket.'],
 gubbinslore:['The Far Light','Past the last lighthouse of the Lantern Sea, they say, there\u2019s a light where dreams come true. Gubbins says folk say lots of things.'],
 sign:['The sign','Population: one bucket. Two now, probably. I think I\u2019m the two.'],
 fire:['The campfire','Somebody keeps this fire lit. It smells like it wants to cook something.'],
 tree:['Wobble trees','The trees here sway even when there\u2019s no wind. One of them sighed at me.'],
 rocks:['North rocks','The water past the barnacled rocks churns like something big lives down there.'],
 crab:['Sir Thimble','A crab in a thimble helmet. We salute each other now. It\u2019s our thing.'],
 head:['Stone head','Half buried in the west sand. Eyes closed, like it\u2019s trying to remember a song.'],
 headnight:['The humming','At night the stone head hums. Something about the west shore, and the moon.'],
 wick:['Brimble','A living galley flame, keeping house in a hollow in the dunes. He fed the crew of the Grinning Gull for forty years and floated here in a teapot. Proud, fussy, always hungry.'],
 islet:['The small islands','Each island here has its own shape and temper: a grove to land on, the Tangle and the Thicket thick with twisted trees, two fallow mudflats with something dead in them, a clearing that glows at night, and a far grove of the oldest, most twisted wood.'],
 fallow:['Fallow ground','Grey, bubbling, sour. Parts of the forest have given up growing. Something is draining them.'],
 shadowtree:['Shadow tree','Black bark, hollow heart, and canopies that hide what walks under them. Cut one and the way opens; nothing here grows back.'],
 shadow:['The Shadow Forest','A cluster of dark islands past the Key, each its own shape and mood. The big ones are forest, twisted black trees in clumps with paths between, and the trees seem to listen.'],
 shallows:['The shallows','The water is not one depth. It shelves out from every shore, slow in some places, all at once in others; the colour says which. Out at sea there are sandbars to stand on, reefs, and little islands nobody has named.'],
 tinyisle:['A little island','A scrap of land in the open sea, a few trees and nobody. There are more out there. There is no end to them, maybe.'],
 blackwood:['Black wood','A log from a plain shadow tree. Lighter than it looks and it burns long.'],
 twistwood:['Twisted wood','The gnarled trees of the forest give hard wood with grain like rope. The more twisted the tree, the harder the log. This is what real projects want.'],
 ironbark:['Ironbark','The worst-twisted trees give a black wood nearly as hard as stone. Rare, heavy, and worth the fight.'],
 thehollow:['The Hollow','Something the size of a ship lies across the heart of the forest, breathing. Everything keeps its distance. Everything else here is a symptom of it.'],
 hollowmaw:['Hollowmaw','A dead tree until it unfolds. Its heartwood is rotting, so it eats living trees to feel warm. It wants warmth, not me.'],
 mossback:['Mossback','Soft, round, mossy, and starving. It used to eat what the Hollowmaws left. Fed, it follows.'],
 moonlapper:['Moonlapper','Pale, long-necked, eyeless. It laps the moon off the water at night, and the moon thins. It is drinking light because the forest has none.'],
 swimming:['Swimming','I waded in and kept going. There is a rhythm to it: keep stroking and the sea keeps you up; stop and it takes you under and carries you back to the last shore. People say they have swum between islands. Even past the Shadow Forest.'],
 jelly:['Lantern jelly','A glowing bell with trailing threads, drifting where it pleases. Brush one and everything tingles for a while.'],
 swamfar:['The long swim','I swam east off the Key until the dark islands took me in. So the rumour is true.'],
 foraging:['Foraging','The tide gives and the tide takes back. Grab what the waves drop before the backwash, and scrape the salt they leave on rock and piling.'],
 tide:['The tide','Twice a day the sea breathes in and out. High water brings wash-ups. Low water bares a band of wet sand, and the rocks sit in their pools.'],
 hearth:['Cooking','Brimble taught me to cook. A fire is a promise: keep it fed and it keeps you.'],
 driftwood:['Driftwood','Bleached and bone dry. The waves leave it on the sand, and take it back if you dawdle. Burns steady.'],
 kelp:['Dry kelp','Brittle seaweed from the rocky shores. Burns hot and wild, and the smoke smells like the deep.'],
 perfectcook:['Golden both sides','Flip at golden, pull at golden. Eat one and my hands get sharper for a while.'],
 smoky:['Smoky fish','Cooked over a kelp flare, fish come out smoky. The smell gets on my hands and the fish come running.'],
 firstfire:['A fire of my own','I lit a fire with my own hands. Brimble says a fire is a promise. Starve it and all it leaves you is ash.'],
 ash:['Ash','What a starved fire leaves behind. Soft, grey, faintly warm. Brimble gets suspiciously excited about it.'],
 stache:['The Ash Mustache','Brimble braided ten scoops of ash into a mustache, exactly like the one the Gull’s head cook wore. It is ridiculous. It is magnificent. Gubbins pays extra to anyone wearing it.'],
 thimblekit:['The sailmaker’s kit','Sir Thimble’s helmet was the Grinning Gull’s sailmaker’s thimble. He wants the rest of the kit: a palm, a fid and waxed twine, all somewhere the sea put them.'],
 sewing:['How a seam holds','Sir Thimble showed me: the palm pushes, the fid opens, the twine is waxed so it bites. I could sew canvas, given a needle. I do not have one. Yet.'],
 stumpcache:['Something the forest swallowed','A rotted pouch tangled in the roots of a stump, still holding shells. Somebody lost it here long before me.'],
 clam:['A giant clam shell','Old, empty, wedged into the reef nearest the Key. A driftwood stick levers it out. The hinge is the thickest shell I have ever held.'],
 shellblade:['A shell blade','Ground out of a clam hinge on the north rocks, wet sand doing the cutting. Islanders with no stone did exactly this.'],

/* Shadows, the way real ones behave.
   Lights: a tropical sun (rises east, nearly overhead at noon, sets west), a faint moon on the opposite path, and
   every lit fire casting outward. Shadows from one light never stack: a patch of ground is either out of the sun or
   not, so all sun shadows (trunk and canopy, tree and crab) go into one silhouette layer drawn at one darkness.
   Different lights do combine (out of sun and out of firelight is darker than either), so each light has its own
   layer. Cloud shade is its own layer too, and where a cloud covers the sun the sun shadows are cut away, leaving
   only the faint contact shadow every object keeps where it meets the ground. Dense canopy also blocks skylight
   right under the crown (its own layer). Shadows fall on the ground only, not across other objects.

 const s0=w2s(src[0],src[1]),m=kind==='burst'?9:Math.max(2,Math.min(5,Math.round(n/14)+1)),bag=[W-42,H-42];
